<!doctype html><html lang="et"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mükeene pronksiaja väed · V100</title><style>*{box-sizing:border-box}body{margin:0;padding:20px;background:#202e2c;color:#eee5cd;font:15px system-ui}h1{font-size:clamp(20px,3vw,30px);margin:0 0 8px}p{color:#c7c4ad;margin:0 0 20px}a{color:#bbd5f3}.models{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:1400px;margin:auto}.model-card{margin:0;background:#34463c;border:1px solid #6a7b60;border-radius:10px;overflow:hidden}.model-card canvas{display:block;width:100%;height:auto}.model-card figcaption{padding:10px;text-align:center;font-weight:600;border-top:3px solid var(--team)}@media(max-width:700px){body{padding:12px}.models{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.model-card figcaption{font-size:12px;padding:8px 3px}}</style><h1>V100 · Mükeene pronksiaja väed</h1><p>Riigivärvid kilpidel, tuunikatel ja vankritel. <a href="./?demo=bronze-battle">Ava uus 250 vs 250 testlahing →</a></p><main class="models"></main><script type="importmap">{"imports":{"./visuals.js":"./visuals.js?v=100a","./bronze-soldiers-v95.js":"./bronze-soldiers-v95.js?v=100a"}}</script><script type="module">
import * as T from './vendor/three.module.js';import {createSoldier,animateSoldier} from './visuals.js';import {ARMY_COLORS,BRONZE_KINDS,ARMY_COLOR_NAMES} from './bronze-soldiers-v95.js';
// Render the real game models once, using a single WebGL context. Static cards
// stay sharp and fit a two-column phone layout without overlapping labels.
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(512,440);renderer.setPixelRatio(1);renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;
const names=['Odamees','Kirvemees','Vibukütt','Sõjavanker','Ratsavägi','Katapult'];for(let i=0;i<BRONZE_KINDS.length;i++)for(const team of [0,1]){const scene=new T.Scene();scene.background=new T.Color('#6b775b');scene.add(new T.HemisphereLight('#fff3d7','#728369',2));const sun=new T.DirectionalLight('#fff1d5',3);sun.position.set(-4,9,7);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-5,right:5,top:5,bottom:-5});scene.add(sun);const floor=new T.Mesh(new T.PlaneGeometry(50,50),new T.MeshStandardMaterial({color:'#6b775b',roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const man=createSoldier(scene,0,0,ARMY_COLORS[team],BRONZE_KINDS[i],i===0||i===3?'elite':'standard');animateSoldier(man,0,false,{phase:i===2&&team===1?.5:-1,weapon:i===2&&team===1?'sword':'bow'});const sphere=new T.Box3().setFromObject(man).getBoundingSphere(new T.Sphere()),camera=new T.PerspectiveCamera(36,512/440,.1,100),distance=sphere.radius/Math.sin(18*Math.PI/180)*1.08;camera.position.copy(sphere.center).add(new T.Vector3(.65,.35,1).normalize().multiplyScalar(distance));camera.lookAt(sphere.center);renderer.render(scene,camera);const fig=document.createElement('figure'),canvas=document.createElement('canvas'),caption=document.createElement('figcaption');fig.className='model-card';fig.style.setProperty('--team',ARMY_COLORS[team]);canvas.width=512;canvas.height=440;canvas.setAttribute('aria-label',ARMY_COLOR_NAMES[team]+' · '+names[i]);canvas.getContext('2d').drawImage(renderer.domElement,0,0);caption.textContent=ARMY_COLOR_NAMES[team]+' · '+names[i]+(i===2&&team===1?' · mõõk':'');fig.append(canvas,caption);document.querySelector('main').append(fig);}renderer.dispose();window.ready=true;
</script></html>
