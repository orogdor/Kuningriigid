<!doctype html><meta charset="utf-8"><title>V251 road surfaces</title>
<style>html,body{margin:0;background:#556b45;font:12px system-ui;color:#fff}#l{position:fixed;left:0;right:0;bottom:4px;display:flex;justify-content:space-around}</style>
<div id="l"></div>
<script type="importmap">{"imports":{"./vendor/three.module.js":"../../vendor/three.module.js"}}</script>
<script type="module">
// V251 check: the seven era road surfaces side by side, the last column a modern highway (centre line).
import * as T from '../../vendor/three.module.js';
import {roadMaterial} from '../../landscape-v149.js';
const scope=new URLSearchParams(location.search).get('scope')||'detail';
const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);document.body.appendChild(r.domElement);
const scene=new T.Scene();scene.background=new T.Color('#8fa6b5');
scene.add(new T.HemisphereLight(0xe6eedb,0x536246,1.4));const sun=new T.DirectionalLight(0xffe1b0,2.4);sun.position.set(-30,60,30);scene.add(sun);
const ground=new T.Mesh(new T.PlaneGeometry(400,400),new T.MeshStandardMaterial({color:'#5d7146',roughness:1}));ground.rotation.x=-Math.PI/2;scene.add(ground);
const codes=[1,2,3,4,5,6,7,17],names=['1 jalgrada (kiviaeg)','2 vankritee (pronks)','3 kruus (raud)','4 munakivi (keskaeg)','5 sillutis (renessanss)','6 makadam (tööstus)','7 asfalt (moodne)','7 + maantee'];
const half=scope==='world'?3.2:6.5,len=90,gap=scope==='world'?9:17;
codes.forEach((code,k)=>{
 const pos=[],uv=[],lvl=[],idx=[],x0=(k-(codes.length-1)/2)*gap,w=code>=10?half*1.5:half;
 for(let i=0;i<=40;i++){const z=-len/2+i*len/40,bend=Math.sin(z*.05+k)*1.5;
  for(const u of [-1.5,-1,1,1.5]){pos.push(x0+bend+u*w,.02,z);uv.push(u,(z+len/2)/(scope==='world'?1:3.9));lvl.push(code);}
  if(i){const b=(i-1)*4;for(const [a,c] of [[0,1],[1,2],[2,3]])idx.push(b+a,b+c,b+4+a,b+c,b+4+c,b+4+a);}}
 const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(pos,3));g.setAttribute('uv',new T.Float32BufferAttribute(uv,2));g.setAttribute('aLevel',new T.Float32BufferAttribute(lvl,1));g.setIndex(idx);g.computeVertexNormals();
 // detail scope maps local units to world metres (x/4.5, z/3.9); world scope draws in metres directly
 const m=new T.Mesh(g,roadMaterial(scope,{x:0,z:0}));scene.add(m);
 const d=document.createElement('span');d.textContent=names[k];document.getElementById('l').append(d);
});
const cam=new T.PerspectiveCamera(40,innerWidth/innerHeight,1,2000);const span=gap*codes.length;cam.position.set(0,span*.55,span*.45);cam.lookAt(0,0,0);
r.render(scene,cam);requestAnimationFrame(()=>{r.render(scene,cam);window.V251_DONE=true;});
</script>
