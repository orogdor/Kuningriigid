<!doctype html><meta charset="utf-8"><title>V354 designer models in the game renderer</title>
<style>html,body{margin:0;background:#9aa58f}canvas{display:block}</style>
<body><script type="module">
// Shows designer models through the game's own module and renderer.
// ?ids=hall:0,house:0 (game type:age) · window.viewReady resolves when drawn.
import * as T from '../vendor/three.module.js';
import {designedBuildingModelV354,houseDesignStatusV354,designerIdV354} from '../house-designs-v354.js?v=354a';
const list=(new URLSearchParams(location.search).get('ids')||'hall:0,house:0,lumber:0,well:0').split(',').map(x=>{const [type,age]=x.split(':');return {type,age:Number(age)};});
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=T.ACESFilmicToneMapping;
document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color(0xa5ae9d);
scene.add(new T.HemisphereLight(0xd5e5ff,0x66543e,1.6));const sun=new T.DirectionalLight(0xffdfb3,3.4);sun.position.set(-7,11,7);scene.add(sun);
const ground=new T.Mesh(new T.PlaneGeometry(400,400),new T.MeshStandardMaterial({color:0x8d8a68,roughness:1}));ground.rotation.x=-Math.PI/2;scene.add(ground);
const camera=new T.PerspectiveCamera(35,innerWidth/innerHeight,.1,500);
const placed=new Map();
const cols=Math.ceil(Math.sqrt(list.length)),gap=14;
window.viewReady=new Promise(resolve=>{
 const tick=()=>{
  for(const [i,item] of list.entries()){
   if(placed.has(i))continue;
   const model=designedBuildingModelV354(item.type,item.age,null,null);
   if(model){model.position.set((i%cols-(cols-1)/2)*gap,0,(Math.floor(i/cols)-(Math.ceil(list.length/cols)-1)/2)*gap);scene.add(model);placed.set(i,model);}
  }
  const span=cols*gap;camera.position.set(span*.55,span*.62,span*.85);camera.lookAt(0,1.5,0);
  renderer.render(scene,camera);
  const s=houseDesignStatusV354();
  if(placed.size+s.failed>=list.filter(x=>designerIdV354(x.type,x.age)).length&&s.pending===0)setTimeout(()=>{renderer.render(scene,camera);resolve(s);},1500);
  else setTimeout(tick,500);
 };
 tick();
});
</script></body>
