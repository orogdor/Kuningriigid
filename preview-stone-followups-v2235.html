<!doctype html><html lang="et"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kuningriigid V223.5 · kiviaja töökojad</title>
<style>
body{margin:0;background:#b8c6b1;color:#23302a;font:16px system-ui}
canvas{display:block;width:100vw;height:100vh}
header{position:fixed;top:14px;left:14px;right:14px;pointer-events:none}
h1{font:28px Georgia;margin:0 0 6px}
p{margin:4px 0}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;pointer-events:auto}
button,a{font:inherit;border:1px solid #666f60;background:#fff8e9ed;border-radius:6px;padding:8px 11px;color:#23302a;cursor:pointer;text-decoration:none}
button[aria-pressed=true]{background:#4a5b39;color:white}
footer{position:fixed;bottom:14px;left:16px;background:#fff8e9b8;padding:4px 10px;border-radius:6px}
@media(max-width:680px){h1{font-size:22px}nav button{font-size:13px;padding:6px 9px}}
</style>
<canvas id="view"></canvas>
<header><h1>V223.5 · järgmised viis kiviaja ehitist</h1>
<p>Põld on senine protseduuriline lahendus; neli uut töökoda on detailsed protseduurilised lähimudelid, mitte TRELLIS.2 väljund.</p>
<p id="status" role="status">Laadin…</p>
<nav>
<button data-view="all" aria-pressed="true">Kõik koos</button>
<button data-view="field">Põld</button>
<button data-view="claypit">Savivõtukoht</button>
<button data-view="pottery_kiln">Potissepatöökoda</button>
<button data-view="pasture">Loomafarm</button>
<button data-view="mason">Kiviraiuja töökoda</button>
<a href="./?demo=stone&amp;v=2235">Ava mäng</a>
</nav></header>
<footer>Lohista pööramiseks · hiireratas suumimiseks · lähimudel 100 m piires</footer>
<script type="module">
import * as T from './vendor/three.module.js';
import {createTownModelV154} from './town-models-v154.js';
import {createAgeBuilding} from './buildings.js?v=1757a';
import {createFieldModel,createLivestockModel} from './farm-visuals-v127.js';
import {nextStoneBuildingLOD} from './stone-next-buildings-v2234.js?v=2235';
const types=['field','claypit','pottery_kiln','pasture','mason'],scene=new T.Scene();
scene.background=new T.Color('#b8c6b1');
const renderer=new T.WebGLRenderer({canvas:document.querySelector('#view'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputColorSpace=T.SRGBColorSpace;
renderer.toneMapping=T.ACESFilmicToneMapping;
const camera=new T.PerspectiveCamera(40,1,.1,1000),target=new T.Vector3(0,1,0);
let yaw=.35,pitch=.45,distance=Number(new URLSearchParams(location.search).get('distance'))||77,current='all';
scene.add(new T.HemisphereLight(0xf8edda,0x68764e,2.1));
const sun=new T.DirectionalLight(0xffe6bf,2);sun.position.set(-15,28,20);scene.add(sun);
const ground=new T.Mesh(new T.PlaneGeometry(220,140),new T.MeshStandardMaterial({color:'#9ca882',roughness:1}));
ground.rotation.x=-Math.PI/2;ground.position.y=-.04;scene.add(ground);
const models=new Map();
for(let i=0;i<types.length;i++){
 const type=types[i],base=type==='field'?createFieldModel():type==='pasture'?createLivestockModel(0):
  createTownModelV154(type,0,0,42)||createAgeBuilding(type,0,0);
 const m=nextStoneBuildingLOD(base,type,0,42);
 m.position.x=(i-2)*18;scene.add(m);models.set(type,m);
}
document.querySelectorAll('button[data-view]').forEach(b=>b.onclick=()=>{
 current=b.dataset.view;
 for(const[type,m]of models)m.visible=current==='all'||type===current;
 target.set(current==='all'?0:models.get(current).position.x,1.5,0);
 distance=current==='all'?77:24;
 document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
});
const canvas=renderer.domElement;let drag=null;
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};
canvas.onpointermove=e=>{if(!drag)return;yaw-=(e.clientX-drag[0])*.006;
 pitch=Math.max(.1,Math.min(1.3,pitch+(e.clientY-drag[1])*.005));drag=[e.clientX,e.clientY]};
canvas.onpointerup=()=>drag=null;
canvas.onwheel=e=>{e.preventDefault();distance=Math.max(6,Math.min(350,distance*Math.exp(e.deltaY*.001)))};
function frame(){
 renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 camera.position.set(target.x+Math.sin(yaw)*Math.cos(pitch)*distance,target.y+Math.sin(pitch)*distance,target.z+Math.cos(yaw)*Math.cos(pitch)*distance);
 camera.lookAt(target);renderer.render(scene,camera);
 const near=[...models.values()].filter(m=>m.visible&&m.userData.nearActive).length;
 document.querySelector('#status').textContent='Detailses lähivaates '+near+' / '+(current==='all'?4:current==='field'?0:1)+' · põld säilitab oma mudeli';
 requestAnimationFrame(frame);
}frame();
window.stoneFollowupPreview={models,scene,camera,renderer,setDistance:d=>distance=d};
</script></html>
