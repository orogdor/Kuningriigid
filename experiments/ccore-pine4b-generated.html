<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Low-Poly Pine Tree</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111713;
    }

    #viewport {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .panel {
      position: fixed;
      z-index: 10;
      top: 18px;
      left: 18px;
      padding: 14px 16px;
      min-width: 250px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      background: rgba(15, 22, 17, 0.78);
      color: #eef5ed;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
    }

    h1 {
      margin: 0 0 4px;
      font-size: 17px;
      font-weight: 650;
      letter-spacing: 0.01em;
    }

    p {
      margin: 0 0 12px;
      color: #aebcab;
      font-size: 12px;
      line-height: 1.45;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      background: #a8c879;
      color: #14200f;
      font: inherit;
      font-size: 13px;
      font-weight: 750;
      cursor: pointer;
      transition: background 140ms ease, transform 140ms ease;
    }

    button:hover {
      background: #b9db8c;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
      transform: none;
    }

    .hint {
      position: fixed;
      z-index: 10;
      right: 18px;
      bottom: 16px;
      color: rgba(230, 242, 229, 0.62);
      font-size: 11px;
      pointer-events: none;
    }

    @media (max-width: 520px) {
      .panel {
        top: 10px;
        left: 10px;
        right: 10px;
        min-width: 0;
      }

      .hint {
        right: 10px;
        bottom: 10px;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="viewport"></div>

  <div class="panel">
    <h1>Low-Poly Pine Tree</h1>
    <p>Procedural conifer with an irregular layered silhouette, tapered trunk, and asymmetric branch clusters.</p>
    <button id="exportButton" type="button">Export GLB</button>
  </div>

  <div class="hint">Drag to orbit · Scroll to zoom</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";

    const container = document.getElementById("viewport");
    const exportButton = document.getElementById("exportButton");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111713);
    scene.fog = new THREE.Fog(0x111713, 6, 12);

    const camera = new THREE.PerspectiveCamera(
      38,
      window.innerWidth / window.innerHeight,
      0.05,
      100
    );
    camera.position.set(4.2, 3.0, 5.3);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false,
      preserveDrawingBuffer: true
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.35, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.minDistance = 2.2;
    controls.maxDistance = 10;
    controls.maxPolarAngle = Math.PI * 0.49;

    const hemisphere = new THREE.HemisphereLight(0xcce7c0, 0x273120, 2.0);
    scene.add(hemisphere);

    const keyLight = new THREE.DirectionalLight(0xfff4d6, 3.4);
    keyLight.position.set(4, 7, 3);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -4;
    keyLight.shadow.camera.right = 4;
    keyLight.shadow.camera.top = 5;
    keyLight.shadow.camera.bottom = -2;
    keyLight.shadow.camera.near = 0.1;
    keyLight.shadow.camera.far = 15;
    keyLight.shadow.bias = -0.0004;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x75b9d1, 1.4);
    rimLight.position.set(-4, 4, -5);
    scene.add(rimLight);

    function seededRandom(seed) {
      let value = seed >>> 0;
      return function () {
        value += 0x6d2b79f5;
        let t = value;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function createNeedleCluster(radius, length, color) {
      const random = seededRandom(Math.floor(color * 1000));
      const segments = 8;
      const rings = [
        { y: 0, r: radius * 0.18 },
        { y: length * 0.27, r: radius },
        { y: length * 0.66, r: radius * 0.64 },
        { y: length, r: radius * 0.08 }
      ];

      const positions = [];
      const indices = [];

      for (let ringIndex = 0; ringIndex < rings.length; ringIndex++) {
        const ring = rings[ringIndex];

        for (let segment = 0; segment < segments; segment++) {
          const angle = (segment / segments) * Math.PI * 2;
          const variation = 0.86 + random() * 0.28;
          const radialOffset = ringIndex === 0 ? 0 : (random() - 0.5) * radius * 0.16;

          positions.push(
            Math.cos(angle) * (ring.r + radialOffset) * variation,
            ring.y + (random() - 0.5) * length * 0.035,
            Math.sin(angle) * (ring.r + radialOffset) * variation
          );
        }
      }

      for (let ringIndex = 0; ringIndex < rings.length - 1; ringIndex++) {
        for (let segment = 0; segment < segments; segment++) {
          const next = (segment + 1) % segments;
          const a = ringIndex * segments + segment;
          const b = ringIndex * segments + next;
          const c = (ringIndex + 1) * segments + next;
          const d = (ringIndex + 1) * segments + segment;

          indices.push(a, b, d, b, c, d);
        }
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(positions, 3)
      );
      geometry.setIndex(indices);
      geometry.computeVertexNormals();

      const material = new THREE.MeshStandardMaterial({
        color,
        roughness: 0.9,
        metalness: 0,
        flatShading: true,
        side: THREE.DoubleSide
      });

      const mesh = new THREE.Mesh(geometry, material);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function createTaperedBranch(start, end, radiusStart, radiusEnd, material) {
      const direction = new THREE.Vector3().subVectors(end, start);
      const length = direction.length();

      const geometry = new THREE.CylinderGeometry(
        radiusEnd,
        radiusStart,
        length,
        7,
        3,
        false
      );

      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.copy(start).add(end).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function createPineTree() {
      const random = seededRandom(1847);
      const tree = new THREE.Group();
      tree.name = "LowPoly_Pine_Tree";

      const trunkMaterial = new THREE.MeshStandardMaterial({
        color: 0x5b3820,
        roughness: 0.96,
        flatShading: true
      });

      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.065, 0.17, 2.72, 8, 5, false),
        trunkMaterial
      );
      trunk.position.y = 1.36;
      trunk.castShadow = true;
      trunk.receiveShadow = true;
      tree.add(trunk);

      const branchMaterial = new THREE.MeshStandardMaterial({
        color: 0x49301d,
        roughness: 0.95,
        flatShading: true
      });

      const lowerBranches = [
        { angle: 0.10, length: 1.55, lift: 0.78, radius: 0.105 },
        { angle: 1.18, length: 1.72, lift: 0.94, radius: 0.10 },
        { angle: 2.28, length: 1.48, lift: 1.08, radius: 0.095 },
        { angle: 3.38, length: 1.68, lift: 0.96, radius: 0.10 },
        { angle: 4.43, length: 1.42, lift: 1.14, radius: 0.09 },
        { angle: 5.48, length: 1.58, lift: 0.86, radius: 0.105 }
      ];

      lowerBranches.forEach((branch, index) => {
        const start = new THREE.Vector3(
          Math.cos(branch.angle) * 0.07,
          branch.lift,
          Math.sin(branch.angle) * 0.07
        );
        const end = new THREE.Vector3(
          Math.cos(branch.angle) * branch.length,
          branch.lift + branch.length * 0.12,
          Math.sin(branch.angle) * branch.length
        );

        tree.add(
          createTaperedBranch(
            start,
            end,
            branch.radius,
            branch.radius * 0.42,
            branchMaterial
          )
        );

        if (index % 2 === 0) {
          const forkEnd = end.clone().add(
            new THREE.Vector3(
              Math.cos(branch.angle + 0.85) * 0.52,
              0.28,
              Math.sin(branch.angle + 0.85) * 0.52
            )
          );
          tree.add(
            createTaperedBranch(
              end,
              forkEnd,
              branch.radius * 0.55,
              branch.radius * 0.22,
              branchMaterial
            )
          );
        }
      });

      const upperBranches = [
        { angle: 0.32, length: 1.25, lift: 1.62, radius: 0.078 },
        { angle: 1.42, length: 1.36, lift: 1.82, radius: 0.075 },
        { angle: 2.52, length: 1.18, lift: 1.96, radius: 0.07 },
        { angle: 3.62, length: 1.34, lift: 1.78, radius: 0.078 },
        { angle: 4.72, length: 1.16, lift: 2.02, radius: 0.067 }
      ];

      upperBranches.forEach((branch, index) => {
        const start = new THREE.Vector3(
          Math.cos(branch.angle) * 0.06,
          branch.lift,
          Math.sin(branch.angle) * 0.06
        );
        const end = new THREE.Vector3(
          Math.cos(branch.angle) * branch.length,
          branch.lift + branch.length * 0.1,
          Math.sin(branch.angle) * branch.length
        );

        tree.add(
          createTaperedBranch(
            start,
            end,
            branch.radius,
            branch.radius * 0.4,
            branchMaterial
          )
        );

        const clusterCount = index === 0 ? 6 : 5;
        for (let clusterIndex = 0; clusterIndex < clusterCount; clusterIndex++) {
          const angle =
            branch.angle +
            (clusterIndex / clusterCount) * Math.PI * 2 +
            (random() - 0.5) * 0.22;

          const radial = branch.length * (0.76 + random() * 0.2);
          const clusterBase = new THREE.Vector3(
            Math.cos(angle) * radial * 0.72,
            branch.lift + branch.length * 0.25 + (random() - 0.5) * 0.12,
            Math.sin(angle) * radial * 0.72
          );

          const clusterDirection = new THREE.Vector3(
            Math.cos(angle),
            0.42 + random() * 0.4,
            Math.sin(angle)
          ).normalize();

          const clusterLength = 0.68 + random() * 0.62;
          const clusterRadius = 0.27 + random() * 0.13;
          const color = new THREE.Color(
            0x285c32 +
              (random() - 0.5) * 0.16 +
              (clusterIndex % 3) * 0.035
          );

          const cluster = createNeedleCluster(
            clusterRadius,
            clusterLength,
            color
          );

          cluster.position.copy(clusterBase);
          cluster.quaternion.setFromUnitVectors(
            new THREE.Vector3(0, 1, 0),
            clusterDirection
          );

          // Slight lateral rotation breaks up the otherwise regular cones.
          cluster.rotateY(random() * Math.PI);
          tree.add(cluster);
        }
      });

      const crown = new THREE.Mesh(
        createNeedleCluster(0.36, 0.76, 0x356b38),
        trunkMaterial
      );
      crown.position.set(0, 2.63, 0);
      crown.castShadow = true;
      tree.add(crown);

      const ground = new THREE.Mesh(
        new THREE.CircleGeometry(0.34, 9),
        new THREE.MeshStandardMaterial({
          color: 0x342719,
          roughness: 1,
          flatShading: true
        })
      );
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = 0.012;
      ground.receiveShadow = true;
      tree.add(ground);

      tree.traverse((object) => {
        if (object.isMesh) {
          object.castShadow = true;
          object.receiveShadow = true;
        }
      });

      return tree;
    }

    const tree = createPineTree();
    scene.add(tree);

    // A subtle selection outline is intentionally kept outside the exported asset.
    const selectionBox = new THREE.BoxHelper(tree, 0x31462f);
    selectionBox.visible = false;
    scene.add(selectionBox);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    exportButton.addEventListener("click", async () => {
      exportButton.disabled = true;
      exportButton.textContent = "Preparing GLB…";

      try {
        // Export only the tree group, excluding helpers, lights, camera, and ground.
        const exportRoot = new THREE.Group();
        exportRoot.name = "LowPoly_Pine_Tree";

        // Clone the procedural tree so the exporter receives a clean asset root.
        const asset = tree.clone(true);
        asset.position.set(0, 0, 0);
        asset.rotation.set(0, 0, 0);
        asset.scale.set(1, 1, 1);

        const exporter = new GLTFExporter();
        const result = await exporter.parseAsync(asset, {
          binary: true,
          onlyVisible: true,
          trs: false,
          includeCustomExtensions: false
        });

        const blob = new Blob([result], {
          type: "model/gltf-binary"
        });

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "low_poly_pine_tree.glb";
        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => URL.revokeObjectURL(url), 2000);
      } catch (error) {
        console.error("GLB export failed:", error);
        alert("The GLB export failed. Please check the browser console for details.");
      } finally {
        exportButton.disabled = false;
        exportButton.textContent = "Export GLB";
      }
    });
  </script>
</body>
</html>
