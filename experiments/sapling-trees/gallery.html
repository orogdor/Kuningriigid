<!doctype html><html lang="et"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kuningriigid · 30 puu renderdused</title>
<style>body{margin:0;background:#192d29;color:#edf3e7;font:16px system-ui}header,main{max-width:1600px;margin:auto;padding:24px}h1{font-size:clamp(25px,4vw,42px);margin:0 0 8px}p{max-width:850px;line-height:1.5}a{color:#c6df9d}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-bottom:32px}h2{font-size:25px}article{background:#d3dcda;color:#23352b;border-radius:10px;overflow:hidden}article img{display:block;width:100%;aspect-ratio:1;object-fit:contain}article div{padding:14px;background:#e6eddf}article a{color:#265638;margin-right:12px}small{display:block;margin:8px 0}</style>
<header><h1>Kuningriigid · 30 uut puud</h1><p>Blender 5.2.3 + Sapling Tree Gen 1.0.0. Iga pilt on uuesti sisse loetud tegeliku GLB renderdus. Kõik mudelid ootavad visuaalset heakskiitu; põhimängu puud on asendamata.</p><a href="./index.html">Ava 300 / 3000 / 12 000 puu jõudlustest</a> · <a href="https://github.com/orogdor/Kuningriigid/pull/49">Pull request #49</a></header><main id="gallery">Laen mudelite kataloogi…</main>
<script type="module">
const base='../../assets/sapling-trees/',names={pine:'Mänd',spruce:'Kuusk',oak:'Tamm',lime:'Pärn',birch:'Kask',palm:'Palm'},data=await(await fetch(base+'manifest.json')).json(),main=document.querySelector('main');main.textContent='';
for(const [kind,name]of Object.entries(names)){const h=document.createElement('h2');h.textContent=name;main.append(h);const section=document.createElement('section');main.append(section);for(const t of data.trees.filter(t=>t.species===kind)){const card=document.createElement('article'),img=document.createElement('img'),body=document.createElement('div'),title=document.createElement('b'),stats=document.createElement('small');img.src=base+t.id+'/preview.png';img.alt=name+' '+t.variant+' — tegeliku GLB render';img.loading='lazy';title.textContent=name+' '+String(t.variant).padStart(2,'0');stats.textContent=`${t.near.triangles} / ${t.mid.triangles} / ${t.far.triangles} kolmnurka (lähi / kesk / kaug)`;body.append(title,stats);for(const [lod,label]of [['near','Lähi GLB'],['mid','LOD GLB'],['far','Impostor GLB']]){const a=document.createElement('a');a.href=base+t.id+'/'+lod+'.glb';a.download=t.id+'_'+lod+'.glb';a.textContent=label;body.append(a)}card.append(img,body);section.append(card);}}
</script></html>
