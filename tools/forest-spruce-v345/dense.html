<!doctype html><meta charset="utf-8"><title>V345 dense forest</title>
<style>html,body{margin:0;background:#9fb3bd;overflow:hidden}</style>
<script type="module">
// Dense stand with three LOD levels (instanced, like sapling-trees-v328.js).
// ?set=v345 | sapling  ?n=3000
import * as T from '../../vendor/three.module.js';
import {loadGLB} from '../../glb-lite-v221.js';
const q=new URLSearchParams(location.search),set=q.get('set')||'v345',N=+(q.get('n')||3000);
const root=set==='v345'?'../../assets/forest-spruce-v345/':'../../assets/sapling-trees/';
const W=innerWidth,H=innerHeight,renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(W,H);renderer.setPixelRatio(1);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.outputColorSpace=T.SRGBColorSpace;document.body.append(renderer.domElement);
renderer.shadowMap.enabled=true;
const scene=new T.Scene();scene.background=new T.Color('#a9bcc6');scene.fog=new T.Fog('#a9bcc6',120,420);
scene.add(new T.HemisphereLight('#e2ecf2','#4a4430',1.15));const sun=new T.DirectionalLight('#fff1dc',2.3);sun.position.set(60,90,40);sun.castShadow=true;sun.shadow.bias=-.0004;sun.shadow.normalBias=.05;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-60,right:60,top:60,bottom:-60,far:400});scene.add(sun);
const ground=new T.Mesh(new T.PlaneGeometry(800,800),new T.MeshStandardMaterial({color:'#4a4128',roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const camera=new T.PerspectiveCamera(50,W/H,.5,1200);camera.position.set(0,55,95);camera.lookAt(0,0,0);
const tex=new Map();
async function level(v,lod){const d=await loadGLB(`${root}spruce_0${v+1}/${lod}.glb`);
 return d.primitives.map((p,i)=>{let map=null;if(p.image){const k=lod==='far'?v+':'+i:'foliage';map=tex.get(k);if(!map){map=new T.Texture(p.image);map.flipY=false;map.colorSpace=T.SRGBColorSpace;map.needsUpdate=true;tex.set(k,map);}}
  const params={color:new T.Color().fromArray(p.color),map,alphaTest:map?.4:0,side:T.DoubleSide};
  return {geometry:p.geometry,material:lod==='far'?new T.MeshBasicMaterial(params):new T.MeshStandardMaterial({...params,roughness:.95})};});}
const levels={};for(let v=0;v<5;v++)for(const lod of ['near','mid','far'])levels[v+lod]=await level(v,lod);
// Same placement for both sets: heights normalised to 9-16 m like the game.
let x=345;const rnd=()=>(x=(x*1103515245+12345)>>>0)/4294967296;
const rows={};let tris=0,counts={near:0,mid:0,far:0};
const geomH=v=>{const g=levels[v+'near'][0].geometry;g.computeBoundingBox();let h=0;for(const p of levels[v+'near']){p.geometry.computeBoundingBox();h=Math.max(h,p.geometry.boundingBox.max.y);}return h;};
const heights=[0,1,2,3,4].map(geomH);
for(let i=0;i<N;i++){const px=(rnd()-.5)*360,pz=(rnd()-.5)*300-60,v=i%5,h=10+rnd()*7;
 const d=Math.hypot(px-camera.position.x,pz-camera.position.z,camera.position.y),pix=h*H/(2*Math.tan(25*Math.PI/180)*d);
 const lod=pix>45?'near':pix>12?'mid':'far';counts[lod]++;
 const m=new T.Matrix4().compose(new T.Vector3(px,0,pz),new T.Quaternion().setFromAxisAngle(new T.Vector3(0,1,0),rnd()*6.3),new T.Vector3().setScalar(h/heights[v]));
 (rows[v+lod]??=[]).push(m);}
for(const [key,list] of Object.entries(rows))for(const p of levels[key]){const mesh=new T.InstancedMesh(p.geometry,p.material,list.length);list.forEach((m,i)=>mesh.setMatrixAt(i,m));mesh.castShadow=key.endsWith('near');mesh.receiveShadow=true;scene.add(mesh);tris+=(p.geometry.index?p.geometry.index.count:p.geometry.attributes.position.count)/3*list.length;}
renderer.render(scene,camera);renderer.render(scene,camera);
window.__stats={set,trees:N,counts,triangles:Math.round(tris),drawCalls:renderer.info.render.calls};window.__done=true;
</script>
