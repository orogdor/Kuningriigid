<!doctype html><meta charset="utf-8"><title>V345 impostor bake</title>
<script type="module">
// Renders each near.glb from the front, the side and above with a transparent
// background. make_far.py turns the images into far.glb (6 triangles).
import * as T from '../../vendor/three.module.js';
import {loadGLB} from '../../glb-lite-v221.js';
const SIDE_W=256,SIDE_H=512,TOP=256;
const renderer=new T.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.setClearColor(0x000000,0);
document.body.append(renderer.domElement);
const out={};
const q=new URLSearchParams(location.search),root='../../'+(q.get('root')||'assets/sapling-trees')+'/',ids=(await (await fetch(root+'manifest.json')).json()).trees.map(t=>t.id);
for(let i=0;i<ids.length;i++){
 const id=ids[i],d=await loadGLB(`${root}${id}/near.glb`);
 const scene=new T.Scene(),group=new T.Group();scene.add(group);
 let map=null;
 for(const p of d.primitives){if(p.image&&!map){map=new T.Texture(p.image);map.flipY=false;map.colorSpace=T.SRGBColorSpace;map.needsUpdate=true;}
  group.add(new T.Mesh(p.geometry,new T.MeshStandardMaterial({map,alphaTest:.5,side:T.DoubleSide,roughness:.95,metalness:0})));}
 // Daylight close to the game's world map: sky fill + sun from the south-east.
 scene.add(new T.HemisphereLight('#e4eef4','#4a4430',1.25));
 const sun=new T.DirectionalLight('#fff1dc',2.2);sun.position.set(20,40,30);scene.add(sun);
 const bounce=new T.DirectionalLight('#8f9a6a',.9);bounce.position.set(-10,-30,-15);scene.add(bounce); // light from the ground: no black undersides
 const box=new T.Box3().setFromObject(group),c=box.getCenter(new T.Vector3()),sz=box.getSize(new T.Vector3());
 const ws=Math.max(sz.x,sz.z)*1.04,hs=sz.y*1.02,ts=ws;
 const shots=[];
 const cam=(w,h)=>new T.OrthographicCamera(-w/2,w/2,h/2,-h/2,.1,400);
 for(const view of ['front','side']){
  renderer.setSize(SIDE_W,SIDE_H);const camera=cam(ws,hs);
  if(view==='front'){camera.position.set(c.x,c.y,c.z+100);camera.lookAt(c.x,c.y,c.z);}
  else{camera.position.set(c.x+100,c.y,c.z);camera.lookAt(c.x,c.y,c.z);}
  renderer.render(scene,camera);shots.push(renderer.domElement.toDataURL('image/png'));
 }
 renderer.setSize(TOP,TOP);const top=cam(ts,ts);top.up.set(0,0,-1);top.position.set(c.x,c.y+200,c.z);top.lookAt(c.x,c.y,c.z);
 renderer.render(scene,top);
 out[id]={front:shots[0],side:shots[1],top:renderer.domElement.toDataURL('image/png'),center:c.toArray(),ws,hs,ts,min:box.min.toArray(),max:box.max.toArray()};
}
window.__bake=out;
</script>
