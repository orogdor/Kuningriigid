<!doctype html><meta charset="utf-8"><style>html,body{margin:0;overflow:hidden}</style>
<script type="module">
import * as T from './vendor/three.module.js';
import {createBuildingModel} from './buildings.js';
import {stoneFortLOD} from './stone-forts-detailed.js';
import {createSoldier} from './visuals.js';
import {towerRoof} from './tower-garrison-v117.js';
const q=new URLSearchParams(location.search),yy=q.get('y')?+q.get('y'):towerRoof({type:'watchtower'},0);
const W=innerWidth,H=innerHeight,r=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(W,H);r.outputColorSpace=T.SRGBColorSpace;r.toneMapping=T.ACESFilmicToneMapping;document.body.append(r.domElement);
const scene=new T.Scene();scene.background=new T.Color('#c9d6dc');scene.add(new T.HemisphereLight('#e4eef4','#5a5236',1.4));const sun=new T.DirectionalLight('#fff',2.2);sun.position.set(20,40,30);scene.add(sun);
const g=new T.Mesh(new T.PlaneGeometry(200,200),new T.MeshStandardMaterial({color:'#6b6040'}));g.rotation.x=-Math.PI/2;scene.add(g);
const low=createBuildingModel('watchtower',0),tw=stoneFortLOD(low,'watchtower',0,0,1,3);scene.add(tw);
let mesh=null;try{mesh=await tw.build();tw.add(mesh);low.visible=false;}catch(e){console.log('build fail',e)}
const box=new T.Box3().setFromObject(mesh||low);console.log('BOX',JSON.stringify([box.min.toArray(),box.max.toArray()]));
// probe: highest walkable surface under tower centre (raycast down)
const rc=new T.Raycaster(new T.Vector3(.3,30,.3),new T.Vector3(0,-1,0));const hits=rc.intersectObject(mesh||low,true).map(h=>+h.point.y.toFixed(2));console.log('HITS',JSON.stringify(hits));
for(const [x,z] of [[-1.2,-.8],[0,0],[1.2,.8],[1.1,-1.1],[-1.1,1.1]]){const s=new T.Group();createSoldier(s,0,0,'#a4ab8d','stone_guard');s.position.set(x,yy,z);s.scale.setScalar(.85);scene.add(s);}
const gs=new T.Group();createSoldier(gs,0,0,'#a4ab8d','stone_guard');gs.position.set(5,0,3);gs.scale.setScalar(2.2);scene.add(gs);
const cam=new T.PerspectiveCamera(35,W/H,.1,300);cam.position.set(9,7.5,11);cam.lookAt(0,5.5,0);
setTimeout(()=>{r.render(scene,cam);window.__done=1},9000);
</script>
