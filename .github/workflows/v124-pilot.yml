name: V124 Long Campaign Pilot
on:
  push:
    branches: [main]
    paths: [TEST_V124_PILOT.mjs, .github/workflows/v124-pilot.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node TEST_V124_PILOT.mjs
