name: V120 English UI and responsive layout
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'localization.js'
      - 'locale-en-v120.js'
      - 'research-unlocks-en-v120.js'
      - 'research-tree-v119.js'
      - 'research-ui.js'
      - 'ui-v120.css'
      - 'TEST_V120_UI.mjs'
      - '.github/workflows/ui-v120.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test tools
        run: |
          npm install --no-save playwright
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium --with-deps
          fi
      - name: Validate all translated research and live layout
        run: |
          node TEST_V120_LOCALE.mjs
          python3 -m http.server 8765 >/tmp/v120-server.log 2>&1 &
          node TEST_V120_UI.mjs
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v120-english-layout-screenshots
          path: artifacts-v120/*.png
          if-no-files-found: ignore
