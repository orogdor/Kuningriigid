name: V124 Persist 240-Turn Campaign Snapshot
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: v124-campaign-240-turns
          run-id: 39862389552
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: checkpoint
      - name: Commit exact 240-turn research and economy telemetry
        run: |
          set -e
          mkdir -p reports/V124
          cp checkpoint/campaign.json reports/V124/checkpoint-240.json
          cp checkpoint/CAMPAIGN_REPORT.md reports/V124/CHECKPOINT_240.md
          git config user.name "Kuningriigid Test Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/V124/checkpoint-240.json reports/V124/CHECKPOINT_240.md
          git diff --cached --quiet || (git commit -m "V124: archive 240-turn campaign with two countries reaching Modern Age" && git push origin HEAD:main)
