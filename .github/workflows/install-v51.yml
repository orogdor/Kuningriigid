name: Paigalda Kuningriigid V51
on:
  push:
    branches: [main]
    paths:
      - 'Kuningriigid_V51_patch.zip'
      - '.github/workflows/install-v51.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install-v51:
    runs-on: ubuntu-latest
    steps:
      - name: Laadi praegune GitHubi mäng
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Paigalda V51 failid
        run: |
          unzip -q -o Kuningriigid_V51_patch.zip -d .
          test -s index.html
          test -s civilization.js
          test -s v51-systems.js
          test -s TEST_V51.mjs
          grep -q 'Kuningriigid V51' index.html
      - name: Kontrolli JavaScripti ja 3D regressioone
        run: |
          for file in civilization.js civilization-core.js ai-strategy.js navigation.js v51-systems.js; do node --check "$file"; done
          node TEST_V50.mjs
          V51_SEED=17 V51_STEPS=2400 node TEST_V51.mjs
          V51_SEED=78 V51_STEPS=1200 node TEST_V51.mjs
          V51_SEED=321 V51_STEPS=1200 node TEST_V51.mjs
      - name: Salvesta V51 mangu failid
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "V51: fog of war, armies, city oversight, AI and saves"
            git push origin HEAD:main
          fi
