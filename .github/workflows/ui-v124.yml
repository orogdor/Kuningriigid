name: V124 Playable Battle Replays Browser QA
on:
  push:
    branches: [main]
    paths:
      - 'TEST_V124_UI.mjs'
      - '.github/workflows/ui-v124.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  replay-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium --with-deps
          fi
      - name: Check replay #1 mobile and #7 / #10 desktop
        run: |
          python3 -m http.server 8765 >/tmp/v124-replays-http.log 2>&1 &
          node TEST_V124_UI.mjs
      - name: Save replay screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v124-battle-replay-screenshots
          path: artifacts-v124-ui/*.png
          if-no-files-found: ignore
