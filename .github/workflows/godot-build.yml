name: Godot Windows and Android builds
on:
  push:
    branches: [godot-port-lahtekood]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
          curl --fail --location --retry 3 "$base/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"
          curl --fail --location --retry 3 "$base/Godot_v4.7.2-stable_export_templates.tpz" -o /tmp/templates.zip
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q /tmp/templates.zip 'templates/*' -d /tmp
          mv /tmp/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
      - name: Prepare Android SDK and a temporary test key
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;35.0.1" "platforms;android-35"
          keytool -genkeypair -v -keystore /tmp/kuningriigid-debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Import game resources
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --import
      - name: Export Windows
        run: |
          mkdir -p build/windows
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release "Windows Desktop" build/windows/Kuningriigid.exe
      - name: Export Android test APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /tmp/kuningriigid-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build/android
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-debug Android build/android/Kuningriigid-test.apk
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Kuningriigid-Godot-Windows
          path: build/windows/
          if-no-files-found: error
      - name: Upload Android test build
        uses: actions/upload-artifact@v4
        with:
          name: Kuningriigid-Godot-Android-test
          path: build/android/*.apk
          if-no-files-found: error
