name: Godot Windows and Android builds
on:
  push:
    branches: [godot-port-lahtekood]
    tags: ['godot-content-*']
  workflow_dispatch:
concurrency:
  group: godot-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
          curl --fail --location --retry 3 "$base/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"
          curl --fail --location --retry 3 "$base/Godot_v4.7.2-stable_export_templates.tpz" -o /tmp/templates.zip
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q /tmp/templates.zip 'templates/*' -d /tmp
          mv /tmp/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
      - name: Prepare Android SDK and a temporary test key
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;35.0.1" "platforms;android-35"
          keytool -genkeypair -v -keystore /tmp/kuningriigid-debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Import game resources
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --import
      - name: Export Windows
        run: |
          mkdir -p build/windows
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release "Windows Desktop" build/windows/Kuningriigid.exe
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Kuningriigid-Godot-Windows
          path: build/windows/
          if-no-files-found: error
      - name: Export Android test APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /tmp/kuningriigid-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build/android
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-debug Android build/android/Kuningriigid-test.apk
      - name: Upload Android test build
        uses: actions/upload-artifact@v4
        with:
          name: Kuningriigid-Godot-Android-test
          path: build/android/*.apk
          if-no-files-found: error
      - name: Build and publish content updates
        if: startsWith(github.ref, 'refs/tags/godot-content-')
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.GODOT_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.GODOT_ANDROID_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.GODOT_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_RELEASE_KEYSTORE_B64" ] || [ -z "$ANDROID_RELEASE_KEY_ALIAS" ] || [ -z "$ANDROID_RELEASE_KEY_PASSWORD" ]; then
            echo "Missing the persistent Android release signing secrets." >&2
            exit 1
          fi
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/android-release.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/android-release.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER="$ANDROID_RELEASE_KEY_ALIAS"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$ANDROID_RELEASE_KEY_PASSWORD"
          sed -i "s|^version/code=.*|version/code=$GITHUB_RUN_NUMBER|" export_presets.cfg
          sed -i "s|^version/name=.*|version/name=\"$GITHUB_REF_NAME\"|" export_presets.cfg
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release Android build/android/Kuningriigid.apk
          (cd build/windows && zip -q -r ../Kuningriigid-Windows.zip .)
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-pack "Windows Desktop" build/windows-update.pck
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-pack Android build/android-update.pck
          windows_sha=$(sha256sum build/windows-update.pck | cut -d' ' -f1)
          android_sha=$(sha256sum build/android-update.pck | cut -d' ' -f1)
          windows_size=$(stat -c%s build/windows-update.pck)
          android_size=$(stat -c%s build/android-update.pck)
          gh release create "$GITHUB_REF_NAME" build/Kuningriigid-Windows.zip build/android/Kuningriigid.apk build/windows-update.pck build/android-update.pck --verify-tag --prerelease --latest=false --title "Godot content $GITHUB_REF_NAME" --notes "Godot 0.1.0 compatible content update."
          base_url="https://github.com/orogdor/Kuningriigid/releases/download/$GITHUB_REF_NAME"
          jq -n --argjson rev "$GITHUB_RUN_NUMBER" --arg wu "$base_url/windows-update.pck" --arg ws "$windows_sha" --argjson wz "$windows_size" --arg au "$base_url/android-update.pck" --arg as "$android_sha" --argjson az "$android_size" '{schema:1,base:"0.1.0",revision:$rev,packages:{Windows:{url:$wu,sha256:$ws,size:$wz},Android:{url:$au,sha256:$as,size:$az}}}' > "$RUNNER_TEMP/manifest.json"
          git fetch origin godot-update-channel
          git switch --detach FETCH_HEAD
          cp "$RUNNER_TEMP/manifest.json" manifest.json
          git add manifest.json
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -m "Publish Godot content $GITHUB_REF_NAME"
          git push origin HEAD:refs/heads/godot-update-channel
