name: V159 First Medieval Age – V152-V158 Compatibility Regression
on:
  push:
    branches: [main]
    paths:
      - 'scripts/make-ai-medieval-v159.mjs'
      - '.github/workflows/medieval-v159.yml'
      - 'TEST_V159_BROWSER.mjs'
      - 'TEST_V139.mjs'
      - 'TEST_V138.mjs'
      - 'TEST_V67.mjs'
      - 'TEST_V68.mjs'
      - 'TEST_V142_BROWSER.mjs'
      - 'TEST_V152.mjs'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: medieval-v159
  cancel-in-progress: true
jobs:
  medieval:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check game code and regression rules
        run: |
          node --check civilization.js
          node --check civilization-core.js
          node --check scripts/make-ai-medieval-v159.mjs
          node --check ai-medieval-demo-v159.js
          node scripts/test.mjs rules --jobs 2
          node TEST_V147.mjs
          node TEST_V148.mjs
      - name: Check V152 visual models
        run: node TEST_V152.mjs --node-only
      - name: Simulate the genuine first Medieval Age transition
        run: node scripts/make-ai-medieval-v159.mjs
      - name: Verify first Medieval transition and save continuity
        run: |
          test -s scenarios/ai-medieval-v159.json
          test -s RAPORT_V159_KESKAEG.md
          test -s scenarios/ai-medieval-v159.manifest.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const s=JSON.parse(fs.readFileSync('scenarios/ai-medieval-v159.json','utf8'));
          const m=JSON.parse(fs.readFileSync('scenarios/ai-medieval-v159.manifest.json','utf8'));
          const t=s.medievalTestV159;
          if(!t||s.demo!=='ai-medieval-v159'||s.ages[0]<3||t.turn!==m.turn||t.medievalAt+30!==m.turn)
            throw Error('Invalid Medieval I saved state '+JSON.stringify({t,ages:s.ages}));
          if(!s.cities.some(c=>c.id===t.targetCityId&&c.team===0))
            throw Error('Playable AI town was not transferred');
          if(m.totalCities<12||m.totals.pop<150||m.turn>350||m.totals.withMarket<6||m.totals.totalCombatUnits<8)
            throw Error('World stagnated before first Medieval transition '+JSON.stringify({turn:m.turn,cities:m.totalCities,population:m.totals.pop}));
          console.log('MEDIEVAL I VERIFIED',JSON.stringify({turn:m.turn,cities:m.totalCities,population:m.totals.pop,ages:m.byTeam.map(x=>x.age)}));
          NODE
      - name: Browser regressions on phone and desktop with Claude soldiers and terrain
        run: |
          npm install --no-save playwright
          export CHROME_PATH="$(command -v google-chrome)"
          test -x "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          python3 -m http.server 8765 >/tmp/v159-http.log 2>&1 &
          node TEST_V159_BROWSER.mjs
          node TEST_V143_BROWSER.mjs
          node TEST_V149_BROWSER.mjs
          node TEST_V152.mjs
          V148_REPLAYS=1,6 node TEST_V148_BROWSER.mjs
      - name: Attach statistics and visual regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v159-medieval-i-report
          path: |
            scenarios/ai-medieval-v159.manifest.json
            scenarios/ai-medieval-v159.json
            RAPORT_V159_KESKAEG.md
            artifacts-v159/
            artifacts-v143/
            artifacts-v148/
            artifacts-v149/
            artifacts-tests/
      - name: Commit verified Medieval I game state and report
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add scenarios/ai-medieval-v159.json scenarios/ai-medieval-v159.manifest.json RAPORT_V159_KESKAEG.md
          git commit -m "V159: validated Claude V158 world at Medieval +30 checkpoint"
          git reset --hard HEAD
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
  publish:
    needs: medieval
    uses: ./.github/workflows/avaldamine.yml
    with:
      validated: true
