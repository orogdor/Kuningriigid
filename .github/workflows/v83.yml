name: V83 Menu and New Game Regression
on:
  push:
    branches: [feature/v83-menu-polish-playtest, main]
    paths: ['boot-v83.js', 'civilization.js', 'index.html', 'style.css', 'localization.js', 'locale-en.js', 'TEST_V83_MENU.mjs', '.github/workflows/v83.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  menu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node --check boot-v83.js
          node --check civilization.js
          node --experimental-vm-modules TEST_V83_BOOT.mjs
          node TEST_V73.mjs
          node TEST_V82.mjs
      - run: |
          npm install --no-save playwright
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium --with-deps
          fi
      - name: Test new game, resume, mobile layout, save transfer and startup failure
        run: |
          python3 -m http.server 8765 >/tmp/v83-server.log 2>&1 &
          node TEST_V83_MENU.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V83-menu-screenshots
          path: artifacts-v83/
          if-no-files-found: ignore
