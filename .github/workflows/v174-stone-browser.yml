name: V174 Playable Stone Age Takeover Browser Test
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v174-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  playable:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify ready and validated AI save
        id: ready
        run: |
          node --check civilization.js
          node --check ai-stone-demo-v174.js
          node --check TEST_V174_STONE_BROWSER.mjs
          test -s scenarios/ai-stone-v174.json
          test -s scenarios/ai-stone-v174.manifest.json
      - name: Install browser
        run: |
          npm install --no-save playwright
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Test real WebGL, takeover controls and old save preservation
        run: |
          python3 -m http.server 8765 >/tmp/v174-http.log 2>&1 &
          node TEST_V174_STONE_BROWSER.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V174-stone-takeover-photos-and-results
          path: artifacts-v174/
