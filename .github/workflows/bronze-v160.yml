name: V160 Bronze City and Fortification Balance
on:
  push:
    branches: [main]
    paths:
      - 'bronze-city-balance-v160.js'
      - 'growth-balance-v125.js'
      - 'economy.js'
      - 'research.js'
      - 'civilization-core.js'
      - 'ai-strategy.js'
      - 'ancient-walls-v139.js'
      - 'ai-defenses-v128.js'
      - 'TEST_V160.mjs'
      - 'TEST_V125.mjs'
      - 'scripts/make-ai-bronze-v160.mjs'
      - '.github/workflows/bronze-v160.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bronze-balance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Source and unit tests
        run: |
          node --check civilization-core.js
          node --check economy.js
          node --check research.js
          node --check scripts/make-ai-bronze-v160.mjs
          node TEST_V160.mjs
          node TEST_V147.mjs
          node TEST_V125.mjs
      - name: Play through Stone and Bronze ages
        run: node scripts/make-ai-bronze-v160.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v160-bronze-city-report
          path: artifacts-v160/
