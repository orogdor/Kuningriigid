name: V170 visual models, browser and 200-turn regression
on:
  workflow_dispatch:
concurrency:
  group: v170-graphics-qa-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  model-and-save:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Model parser and mesh footprint/triangle budget
        run: |
          for f in town-models-v154.js site-models-v88.js world-models-v152.js farm-visuals-v127.js civilization.js boot-v83.js; do node --check "$f"; done
          node TEST_V154.mjs --node-only
      - name: Save and historical city regression
        run: |
          node TEST_V73.mjs
          node TEST_V163_STONE_CITY.mjs
          node TEST_V169_FOUNDING.mjs
          node TEST_V160.mjs
  desktop-and-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Playwright and browser
        run: |
          npm install --no-save playwright
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Capture live 3D desktop and mobile samples
        run: |
          python3 -m http.server 8765 > /tmp/v170-http.log 2>&1 &
          node TEST_V170_BROWSER.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v170-city-screenshots-and-browser-results
          path: artifacts-v170/
  regression-200:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Compare current gameplay with V169 over 200 turns, including older saves
        run: node regression/compare.mjs --candidate . --base-ref fb8f508085b7577e68ab25ed443a23b9fe738b4d --turns 200 --seed 8417 --output artifacts-v170/regression-200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v170-v169-200-turn-comparison
          path: artifacts-v170/regression-200/
