name: V218 real Sampola AI wall follow-up
on:
  push:
    branches: [main]
    paths:
      - 'scripts/test-ai-sampola-v218.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/test-ai-sampola-v218.mjs
