name: V172 Compact Historical Stone Village QA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v172-layout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compact-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: JavaScript and fast placement/road/old save regression
        run: |
          node --check compact-stone-v172.js
          node --check historic-urban-v138.js
          node --check civilization-core.js
          node --check TEST_V172_LAYOUT.mjs
          node TEST_V172_LAYOUT.mjs
          node TEST_V138.mjs
          node TEST_V139.mjs
          node TEST_V163_STONE_CITY.mjs
          node TEST_V169_FOUNDING.mjs
          node TEST_V73.mjs
      - name: Real AI village growth first 48 turns
        run: node scripts/stone-town-v163-report.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v172-early-village-report
          path: artifacts-v163/
