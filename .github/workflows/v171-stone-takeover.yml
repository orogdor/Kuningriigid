name: V171 Generate Real AI Stone Age Takeover
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v171-stone-takeover.yml'
      - 'scripts/make-ai-stone-v171.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v171-stone-snapshot
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify generator and run honest AI simulation
        run: |
          node --check scripts/make-ai-stone-v171.mjs
          node --check civilization.js
          node scripts/make-ai-stone-v171.mjs
      - name: Validate real takeover output before publishing
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {Civilization} from './civilization-core.js';
          const s=JSON.parse(fs.readFileSync('scenarios/ai-stone-v171.json','utf8'));
          const m=JSON.parse(fs.readFileSync('scenarios/ai-stone-v171.manifest.json','utf8'));
          const city=s.cities.find(c=>c.id===m.selectedCityId);
          assert.equal(s.demo,'ai-stone-v171');
          assert.equal(s.version,4);
          assert.equal(s.ages[0],0);
          assert.equal(city?.team,0);
          assert.ok(m.turn>=60);
          assert.ok(m.targetTown.defensesTotal>=12);
          assert.equal(m.targetTown.defensesReady,m.targetTown.defensesTotal);
          assert.ok(m.targetTown.houses>=3);
          const play=new Civilization(s);
          for(let n=0;n<10;n++)play.tick(.5);
          assert.ok(play.s.time>s.time-0.001);
          console.log('V171 VERIFIED',JSON.stringify({turn:m.turn,name:city.name,age:s.ages[0],
            ready:m.targetTown.defensesReady,total:m.targetTown.defensesTotal,
            buildings:m.targetTown.totalBuildings,bytes:fs.statSync('scenarios/ai-stone-v171.json').size}));
          NODE
      - name: Commit verified real AI state and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scenarios/ai-stone-v171.json scenarios/ai-stone-v171.manifest.json
          git commit -m "V171: publish playable real AI Stone Age takeover snapshot" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v171-generated-stone-game
          path: |
            scenarios/ai-stone-v171.json
            scenarios/ai-stone-v171.manifest.json
