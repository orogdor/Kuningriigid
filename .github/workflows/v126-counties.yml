name: V126 County Rules
on:
  push:
    branches: [main]
    paths: ['counties-v126.js', 'civilization-core.js', 'TEST_V126.mjs', '.github/workflows/v126-counties.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  counties:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node TEST_V126.mjs
      - run: node TEST_V125.mjs
