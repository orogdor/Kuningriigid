name: V175.2 Straight or Curved Wall Builder
on:
  push:
    branches: [main]
    paths:
      - 'wall-draw-v175.js'
      - 'navigation.js'
      - 'fortifications.js'
      - 'civilization-core.js'
      - 'civilization.js'
      - 'TEST_V1752_WALL_DRAW.mjs'
      - '.github/workflows/v1752-wall-draw.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v1752-wall-${{ github.ref }}
  cancel-in-progress: true
jobs:
  physics-and-economy:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Test two wall shapes and real solid segments
        run: |
          node --check wall-draw-v175.js
          node --check navigation.js
          node --check fortifications.js
          node --check civilization-core.js
          node --check civilization.js
          node TEST_V1752_WALL_DRAW.mjs
      - name: Preserve gates, soldiers, roads and old saves
        run: |
          node TEST_V1751_WALL_ROADS.mjs
          node TEST_V168_RING_CORRIDOR.mjs
          node TEST_V173_STREETS.mjs
          node TEST_V59.mjs
          node TEST_V73.mjs
