name: V83 Real Mobile Opening Playtest
on:
  push:
    branches: [feature/v83-menu-polish-playtest, main]
    paths: ['TEST_V83_PLAY.mjs', '.github/workflows/v83-play.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  opening:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save playwright
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Play opening with real mobile controls
        run: |
          python3 -m http.server 8765 >/tmp/v83-play-server.log 2>&1 &
          node TEST_V83_PLAY.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V83-mobile-opening
          path: artifacts-v83/
          if-no-files-found: ignore
