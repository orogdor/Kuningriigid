name: V220 urban growth rules and actual AI city
on:
  push:
    branches: [main]
    paths:
      - 'urban-growth-v220.js'
      - 'scripts/test-urban-growth-v220.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  city:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check civilization-core.js
      - run: node --check historic-urban-v138.js
      - run: node scripts/test-urban-growth-v220.mjs
      - run: node scripts/test-city-housing-walls-v218.mjs
