name: V361 Mesopotamian fortress model regeneration
on:
  push:
    branches:
      - feature/mesopotamian-fortifications-v361
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-fortress:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mesopotamian-fortifications-v361
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated model exporter dependencies
        run: npm install --no-save --prefix /tmp/v361-builder acorn eslint-scope
      - name: Build new fortifications from main-based designer
        env:
          HOUSE_BUILDER_NODE_MODULES: /tmp/v361-builder/node_modules
        run: |
          node tools/mesopotamian-v361/patch-v361.mjs
          node tools/house-builder-v355/build.mjs
          node --check house-builder-v355.js
      - name: Bump existing export tests and validate
        run: |
          node - <<'NODE'
          const fs=require('fs'),path='tests/house-builder-v355.mjs';
          const old=fs.readFileSync(path,'utf8');
          if(!old.includes('v=358a'))throw Error('Expected main V358 model-cache version');
          fs.writeFileSync(path,old.replace('v=358a','v=361a'));
          NODE
          node tests/house-builder-v355.mjs
          node tests/fortress-v361.mjs
      - name: Commit generated HTML and game module
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add majaehitaja/index.html house-builder-v355.js house-designs-v354.js tests/house-builder-v355.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'V361: generate Mesopotamian walls, towers and gates'
            git push origin HEAD:feature/mesopotamian-fortifications-v361
          fi
