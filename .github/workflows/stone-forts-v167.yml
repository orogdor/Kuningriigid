name: V167 Stone Age Palisade Balance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stone-forts-v167.yml'
      - 'stone-village-defenses-v166.js'
      - 'stone-fort-footprints-v168.js'
      - 'ai-rural-v143.js'
      - 'TEST_V168_RING_CORRIDOR.mjs'
      - 'civilization-core.js'
      - 'builders.js'
      - 'civilization.js'
      - 'TEST_V166_STONE_FORTS.mjs'
      - 'scripts/stone-fort-balance-v167.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stone-fort-balance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Check source and gate geometry
        run: |
          node --check stone-village-defenses-v166.js
          node --check civilization-core.js
          node --check builders.js
          node --check civilization.js
          node TEST_V166_STONE_FORTS.mjs
          node TEST_V168_RING_CORRIDOR.mjs
      - name: Prior city economy and fort regressions
        run: |
          node TEST_V139.mjs
          node TEST_V160.mjs
          node TEST_V163_STONE_CITY.mjs
      - name: Three-seed real AI trial
        run: node scripts/stone-fort-balance-v167.mjs
      - name: Upload complete report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v167-stone-fort-balance
          path: artifacts-v167/
