name: V123 Research Preview and Large Detail UI
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'research-tree-v119.js'
      - 'research-preview-v123.js'
      - 'tech-tree-layout-v119.js'
      - 'civilization.js'
      - 'detail-scale-v123.js'
      - 'ui-v123.css'
      - 'TEST_V123_UI.mjs'
      - '.github/workflows/ui-v123.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium --with-deps
          fi
      - name: Validate rendered research previews and large detail map
        run: |
          python3 -m http.server 8765 >/tmp/v123-http.log 2>&1 &
          node TEST_V123_UI.mjs
      - name: Upload research and detail screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v123-research-preview-screenshots
          path: artifacts-v123/*.png
          if-no-files-found: ignore
