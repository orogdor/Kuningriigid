name: V213 prevent city infill across unfinished AI walls
on:
  push:
    branches: [main]
    paths:
      - 'outer-wall-reservation-v213.js'
      - 'scripts/test-wall-reservation-v213.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check civilization-core.js
      - run: node scripts/test-wall-reservation-v213.mjs
      - run: node scripts/test-wall-seams-v212.mjs
      - run: node scripts/test-wall-priority-v188.mjs
