name: V218 diagnose Sampola last old-wall gap
on:
  push:
    branches: [main]
    paths: ['scripts/diagnose-sampola-gap-v218.mjs']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/diagnose-sampola-gap-v218.mjs
