name: Kuningriigid Fast Game Check
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'reports/**'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kuningriigid-fast-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quick-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Main game and wall syntax
        run: |
          node --check civilization.js
          node --check graphics-settings-v226.js
          node --check graphics-runtime-v226.js
          node --check webgpu-safety-v227.js
          node --check vendor/three-gpu-shim.js
          node --check boot-v83.js
          node --check atmosphere-v158.js
          node --check landscape-v149.js
          node --check sea-v158.js
          node --check stone-near-lod.js
          node --check civilization-core.js
          node --check ai-defenses-v128.js
          node --check outer-ring-v184.js
          node --check wall-demo-v184.js
      - name: Historic suburb geometry (V191)
        run: node scripts/test-historic-suburb-v191.mjs
      - name: Continuous natural barriers and gaps (V194)
        run: node scripts/test-natural-closure-v194.mjs
      - name: Sea and cliff suburb demos (V194)
        run: node scripts/test-organic-demo-v190.mjs
      - name: Defense construction priority (V188)
        run: node scripts/test-wall-priority-v188.mjs
      - name: Graphics settings V226 unit test
        run: node scripts/test-graphics-v226.mjs
      - name: V233 farm and Stone Age far LOD regression
        run: node scripts/test-farming-lod-v233.mjs
      - name: V234 Stone Age equipment geometry regression
        run: node scripts/test-equipment-v234.mjs
      - name: V235 day cycle and city torch regression
        run: node scripts/test-daynight-v235.mjs
      - name: V236 scouts and door torch regressions
        run: node scripts/test-scout-torch-v236.mjs
      - name: Gameplay smoke test
        run: node scripts/test.mjs traffic
