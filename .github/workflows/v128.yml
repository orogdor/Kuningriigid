name: Fast Game Validation
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'reports/**', 'V88_*TEST.json', 'V88_*TEST.jsonl.gz']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: current-game-validation
  cancel-in-progress: true
jobs:
  traffic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node scripts/test.mjs traffic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traffic-fast-results
          path: artifacts-tests/
  regression:
    needs: traffic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node scripts/test.mjs rules --jobs 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-results
          path: artifacts-tests/
  browser:
    needs: traffic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [science, traffic, interface, ai-city, ai-city-v136, ai-city-v137, ai-city-v138, ai-city-v139]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: |
          npm install --no-save playwright
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - run: |
          python3 -m http.server 8765 >/tmp/game-http.log 2>&1 &
          if [ '${{ matrix.profile }}' = science ]; then
            node TEST_V141_BROWSER.mjs
          elif [ '${{ matrix.profile }}' = traffic ]; then
            node TEST_V133_BROWSER.mjs
          elif [ '${{ matrix.profile }}' = ai-city-v139 ]; then
            node TEST_V139_BROWSER.mjs
          elif [ '${{ matrix.profile }}' = ai-city-v138 ]; then
            node TEST_V138_BROWSER.mjs
          elif [ '${{ matrix.profile }}' = ai-city-v137 ]; then
            node TEST_V137_BROWSER.mjs
          elif [ '${{ matrix.profile }}' = ai-city-v136 ]; then
            node TEST_V136_BROWSER.mjs
          elif [ '${{ matrix.profile }}' = ai-city ]; then
            node TEST_V135_BROWSER.mjs
          else
            node TEST_V128_BROWSER.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.profile }}-evidence
          path: |
            artifacts-v128/
            artifacts-v133/
            artifacts-v135/
            artifacts-v136/
            artifacts-v137/
            artifacts-v138/
            artifacts-v139/
            artifacts-v141/
  publish:
    needs: [traffic, regression, browser]
    uses: ./.github/workflows/avaldamine.yml
    with:
      validated: true
