name: Kuningriigid Fast Game Check
# Only one short, automatic job per game-code push. No browser matrix or publishing.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'reports/**'
      - '.github/workflows/**'
      - 'artifacts-*/**'
      - 'V88_*TEST.json'
      - 'V88_*TEST.jsonl.gz'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kuningriigid-fast-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quick-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax of playable game and wall navigation
        run: |
          node --check civilization.js
          node --check civilization-core.js
          node --check navigation.js
          node --check wall-draw-v175.js
          node --check economy.js
          node --check campaign.js
      - name: Wood tower geometry and footprint regression (V175.6)
        run: node TEST_V1756_WOOD_TOWER.mjs
      - name: Tower patrol and siege recall regression (V175.7)
        run: |
          node --check tower-patrol-v1757.js
          node --check civilization.js
          node TEST_V1757_TOWER_PATROL.mjs
      - name: Fast gameplay and road smoke tests
        run: node scripts/test.mjs traffic
