name: Kuningriigid Fast Game Check
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'reports/**'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kuningriigid-fast-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quick-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Main game and wall syntax
        run: |
          node --check civilization.js
          node --check civilization-core.js
          node --check ai-defenses-v128.js
          node --check outer-ring-v184.js
          node --check wall-demo-v184.js
      - name: Historic suburb geometry (V191)
        run: node scripts/test-historic-suburb-v191.mjs
      - name: Sea and cliff suburb demos (V190–191)
        run: node scripts/test-organic-demo-v190.mjs
      - name: Defense construction priority (V188)
        run: node scripts/test-wall-priority-v188.mjs
      - name: Gameplay smoke test
        run: node scripts/test.mjs traffic
