name: Paigalda Kuningriigid V50 failid
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract-v50:
    runs-on: ubuntu-latest
    steps:
      - name: Laadi Kuningriigid
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Paki V50 mudelid ja mängumootor lahti
        run: |
          unzip -q -o Kuningriigid_V50_patch.zip -d .
          test -s index.html
          test -s MUDELID_V50.html
          test -s model-runtime-v50.js
          test -s models-v50/mesh-data.js
          test -s models-v50/stone_builder_1000_2.glb
          grep -q 'Kuningriigid V50' index.html
      - name: Kontrolli JavaScripti süntaksit ja mudeleid
        run: |
          node --check civilization.js
          node --check research-ui.js
          node --check model-runtime-v50.js
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import * as T from './vendor/three.module.js';
          import {createSoldier,animateSoldier} from './visuals.js';
          import {characterQuadCount} from './model-runtime-v50.js';
          for(const age of ['stone','bronze','iron','medieval','renaissance','industrial','modern']){
            const kind=age+'_builder';
            assert(characterQuadCount(kind)>300 && characterQuadCount(kind)<=1000,kind);
            const model=createSoldier(new T.Group(),0,0,'#a99c77',kind);
            assert.equal(model.userData.rig.archetype,kind);
            animateSoldier(model,1,true,{phase:-1,action:'build'});
          }
          console.log('V50: seven builder models and animations validated');
          NODE
      - name: Salvesta V50 päris lähtefailid GitHubi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Avalda V50 mäng ja 3D ehitajate mudelid"
            git push origin HEAD:main
          fi
