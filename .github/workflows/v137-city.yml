name: V137 Economy and City Expansion
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v137-city.yml'
      - 'TEST_V137.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node --check civilization-core.js
      - run: node TEST_V137.mjs
