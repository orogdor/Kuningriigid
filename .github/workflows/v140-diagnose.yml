name: V140 Modernity Block Diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v140-diagnose.yml'
      - 'scripts/diagnose-modern-block-v140.mjs'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node scripts/diagnose-modern-block-v140.mjs
