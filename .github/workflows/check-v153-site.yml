name: V153 Public Web Save Check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-v153-site.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-public-save:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Confirm V153 saved AI state is publicly accessible
        run: |
          for attempt in $(seq 1 16); do
            url="https://orogdor.github.io/Kuningriigid/scenarios/ai-medieval-v153.json?v=153-20261024&check=${GITHUB_RUN_ID}-${attempt}"
            if curl --fail --silent --show-error --location --max-time 12 "$url" -o /tmp/medieval-v153.json; then
              if node --input-type=module -e "import fs from 'node:fs'; const s=JSON.parse(fs.readFileSync('/tmp/medieval-v153.json','utf8')); const t=s.medievalTestV153; if(s.demo!=='ai-medieval-v153'||s.ages[0]<3||!t||t.turn!==t.medievalAt+30||!s.cities.some(c=>c.id===t.targetCityId&&c.team===0))process.exit(1);console.log('PUBLIC V153 VERIFIED',t.turn,s.cities.length+' cities')"; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'The public V153 AI save does not match the tested simulation' >&2
          exit 1
