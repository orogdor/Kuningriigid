name: V212 real wall-deposit collision and gap repair
on:
  push:
    branches: [main]
    paths:
      - 'scripts/test-wall-seams-v212.mjs'
      - 'wall-deposit-v212.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check civilization-core.js
      - run: node scripts/test-wall-priority-v188.mjs
      - run: node scripts/test-wall-seams-v212.mjs
