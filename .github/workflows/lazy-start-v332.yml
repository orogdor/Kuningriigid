name: V332 lazy startup browser validation
on:
  push:
    branches: [feature/lazy-start-v332]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Test save worker
        run: node tests/snapshot-lazy-v332.mjs
      - name: Install browser control
        run: npm install --prefix /tmp/lazy-check playwright@1.56.1 --fetch-retries=1 --fetch-timeout=60000
      - name: Check normal game and requested demos
        env:
          TREE_NODE_MODULES: /tmp/lazy-check/node_modules
        run: |
          export CHROMIUM_PATH=$(command -v google-chrome || command -v chromium || true)
          if [ -z "$CHROMIUM_PATH" ]; then
            /tmp/lazy-check/node_modules/.bin/playwright install chromium
            export CHROMIUM_PATH=$(node -e "console.log(require('/tmp/lazy-check/node_modules/playwright').chromium.executablePath())")
          fi
          node tests/lazy-start-v332-browser.cjs
