name: Paigalda V53 mäng ja teede parandus
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install-v53:
    runs-on: ubuntu-latest
    steps:
      - name: Laadi hoidlasse salvestatud mäng
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Paigalda uusimad mängufailid
        run: |
          unzip -q -o Kuningriigid_V53_patch.zip -d .
          test -s index.html
          test -s TEST_V53.mjs
          test -s roads.js
          grep -q 'Kuningriigid V53' index.html
      - name: Kontrolli avastusi, teid, mudeleid ja varasemat mängu
        run: |
          node --check civilization.js
          node --check civilization-core.js
          node --check atlas-style.js
          node --check research.js
          node TEST_V53.mjs
          node TEST_V51.mjs
          node TEST_V48.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import * as T from './vendor/three.module.js';
          import {createSoldier,animateSoldier} from './visuals.js';
          import {characterQuadCount} from './model-runtime-v50.js';
          for(const age of ['stone','bronze','iron','medieval','renaissance','industrial','modern']){
            const name=age+'_builder';
            assert(characterQuadCount(name)>300 && characterQuadCount(name)<=1000,name);
            const model=createSoldier(new T.Group(),0,0,'#ab9976',name);
            assert.equal(model.userData.rig.archetype,name);
            animateSoldier(model,1,true,{phase:-1,action:'build'});
          }
          console.log('V50 builder meshes and animations PASS');
          NODE
      - name: Avalda kinnitatud failid
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "V53: õpikoja avastus ja liiklusest tekkivad uued teed"
            git push origin HEAD:main
          fi
