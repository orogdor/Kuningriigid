name: Kuningriigid latest GitHub Pages
on:
  workflow_call:
    inputs:
      validated:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch game
        uses: actions/checkout@v4
      - name: Validate manual publication
        if: inputs.validated != true
        run: node scripts/test.mjs full --jobs 2
      - name: Verify website entry points
        run: |
          test -s index.html
          test -s civilization.js
          test -s vendor/three.module.js
          node --check civilization.js
          node --check campaign.js
      - name: Prepare website
        run: |
          mkdir -p /tmp/game-pages
          tar --exclude=.git --exclude=node_modules --exclude='artifacts-*' -cf - . | tar -xf - -C /tmp/game-pages
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/game-pages
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
