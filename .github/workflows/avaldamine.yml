name: Kuningriigid GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Get V47 website
        uses: actions/checkout@v4
      - name: Validate game files
        run: |
          test -s index.html
          test -s civilization.js
          test -s vendor/three.module.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
