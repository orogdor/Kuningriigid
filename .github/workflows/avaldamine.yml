name: Kuningriigid latest GitHub Pages
on:
  push:
    branches: [main]
    paths: ['index.html', 'boot-v83.js', 'sapling-trees-v328.js']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Check published game files
        run: |
          test -s index.html
          test -s civilization.js
          test -s civilization-core.js
          test -s vendor/three.module.js
          node --check civilization.js
          node --check civilization-core.js
          node --check stone-near-lod.js
          node --check hud-v301-background.js
          node --check hud-v302-pieces.js
          node tests/ui-v301-background.mjs
          node tests/ui-v302-pieces.mjs
          node --check hud-v303-buttons.js
          node tests/ui-v303-buttons.mjs
      - name: Prepare site
        run: |
          mkdir -p /tmp/game-pages
          tar --exclude=.git --exclude=node_modules --exclude='*.blend' --exclude='*.blend1' --exclude='artifacts-*' -cf - . | tar -xf - -C /tmp/game-pages
      - uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/game-pages
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
