name: Kuningriigid latest GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch game
        uses: actions/checkout@v4
      - name: Validate current game without overwriting sources
        run: |
          test -s index.html
          test -s civilization.js
          test -s civilization-core.js
          test -s fortifications.js
          test -s vendor/three.module.js
          node --check civilization.js
          node --check civilization-core.js
          node --check campaign.js
          node --check fortifications.js
          node TEST_V61.mjs
          node TEST_V60.mjs
          node TEST_V59.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
