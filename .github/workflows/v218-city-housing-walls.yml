name: V218 first-wall and real house upgrade regression
on:
  push:
    branches: [main]
    paths:
      - 'scripts/test-city-housing-walls-v218.mjs'
      - 'house-upgrade-v218.js'
      - 'old-fortification-policy-v218.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check civilization-core.js
      - run: node --check civilization.js
      - run: node --check ai-defenses-v128.js
      - run: node scripts/test-city-housing-walls-v218.mjs
      - run: node scripts/test-wall-seams-v212.mjs
