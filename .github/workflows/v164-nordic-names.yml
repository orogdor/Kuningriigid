name: V165 Country-Specific Nordic Saga Village Names
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v164-nordic-names.yml'
      - 'folklore-village-names-v164.js'
      - 'civilization-core.js'
      - 'TEST_V164_NAMES.mjs'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  folklore-names:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Validate syntax and epic settlement names
        run: |
          node --check folklore-village-names-v164.js
          node --check civilization-core.js
          node TEST_V164_NAMES.mjs
