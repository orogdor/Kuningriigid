name: V328 actual game Sapling integration
on:
  push:
    branches: [experimental/sapling-trees-30]
    paths: ['sapling-trees-v328.js', 'atlas-biomes-v47.js', 'civilization.js', 'visuals.js', 'tests/sapling-trees/**', '.github/workflows/sapling-live-check.yml']
permissions:
  contents: write
concurrency:
  group: sapling-live-check
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experimental/sapling-trees-30
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Live rendering integration and unchanged placement
        run: |
          node --check civilization.js
          node tests/sapling-trees/live-integration.mjs
          node tests/sapling-trees/existing-placement.mjs
          node scripts/test-daynight-v235.mjs
          node scripts/test-scout-torch-v236.mjs
      - name: Actual game WebGL smoke test
        env:
          TREE_NODE_MODULES: /tmp/tree-live/node_modules
        run: |
          npm install --prefix /tmp/tree-live playwright@1.56.1
          /tmp/tree-live/node_modules/.bin/playwright install --with-deps chromium
          node tests/sapling-trees/game-browser.cjs
      - name: Save integration evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/sapling-v328*.json reports/sapling-trees-live-integration.json previews/sapling-trees/
          git diff --cached --quiet || git commit -m 'Record V328 actual game tree checks [skip ci]'
          git fetch origin experimental/sapling-trees-30
          git rebase origin/experimental/sapling-trees-30
          git push origin HEAD:experimental/sapling-trees-30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sapling-v328-live-game
          path: |
            reports/sapling-v328*.json
            previews/sapling-trees/game-*-v328.png
