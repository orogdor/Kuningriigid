name: V137 AI Housing and Territory Test
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v137-simulation.yml'
      - 'scripts/make-ai-city-v137.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node TEST_V137.mjs
      - name: Run real 245-turn AI settlement campaign
        run: node scripts/make-ai-city-v137.mjs
      - name: Validate city variety, houses and territory coverage
        run: |
          test -s scenarios/ai-city-v137.json
          node -e "const m=require('./scenarios/ai-city-v137.manifest.json');console.log(JSON.stringify(m.roster));if(!m.roster.some(t=>t.houses>0))process.exit(1)"
      - name: Publish live-playable AI town save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scenarios/ai-city-v137.json scenarios/ai-city-v137.manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "V137: publish 245-turn AI housing, field and territory demo"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
