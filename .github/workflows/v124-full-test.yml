name: V124 Full Campaign and Replay Archive
on:
  push:
    branches: [main]
    paths:
      - 'TEST_V124_CAMPAIGN.mjs'
      - 'TEST_V124_BATTLES.mjs'
      - 'battle-replays-v124.js'
      - '.github/workflows/v124-full-test.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Run actual four-faction campaign to final age
        env:
          V124_MAX_TURNS: '1200'
        run: |
          node --check TEST_V124_CAMPAIGN.mjs
          node TEST_V124_CAMPAIGN.mjs
      - name: Save full campaign report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v124-campaign-data
          path: |
            artifacts-v124/campaign.json
            artifacts-v124/CAMPAIGN_REPORT.md
          if-no-files-found: warn
  battles:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Run ten deterministic replay battles
        env:
          V124_BATTLES: '10'
          V124_FIGHT_SECONDS: '90'
        run: |
          node --check TEST_V124_BATTLES.mjs
          node --check battle-replays-v124.js
          node TEST_V124_BATTLES.mjs
      - name: Save exact battle starting saves and combat reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v124-ten-battles
          path: |
            artifacts-v124/battle-*.json
            artifacts-v124/TOP10_BATTLES.json
            artifacts-v124/BATTLE_REPORT.md
          if-no-files-found: warn
  publish-reports:
    needs: [campaign, battles]
    if: needs.campaign.result == 'success' && needs.battles.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          pattern: v124-*
          path: v124-output
          merge-multiple: true
      - name: Commit finished analyses and ten importable battle saves
        run: |
          mkdir -p reports/V124 replays/V124
          cp v124-output/campaign.json reports/V124/campaign.json
          cp v124-output/CAMPAIGN_REPORT.md reports/V124/CAMPAIGN_REPORT.md
          cp v124-output/TOP10_BATTLES.json reports/V124/TOP10_BATTLES.json
          cp v124-output/BATTLE_REPORT.md reports/V124/BATTLE_REPORT.md
          cp v124-output/battle-*.json replays/V124/
          git config user.name "Kuningriigid Test Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/V124 replays/V124
          git commit -m "V124: archive real long campaign telemetry and ten exact playable battle start saves"
          git push origin HEAD:main
