name: One-time Pages source switch to manual Actions
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages-source-once.yml']
permissions:
  contents: read
  pages: write
jobs:
  switch-source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Switch GitHub Pages to Actions-managed deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -L -o /tmp/pages-update-response.json -w '%{http_code}' \
            -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data '{"build_type":"workflow"}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          echo "Pages settings update HTTP ${code}"
          if [ "${code}" != "204" ]; then
            cat /tmp/pages-update-response.json
            exit 1
          fi
          echo "SUCCESS: Pages publication is managed by GitHub Actions workflows."
