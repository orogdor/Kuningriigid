name: V175.4 Solid Gates, Roads and Curved Wall QA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v1754-gate-physics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Test curved wall seams, accessible gates and organic roads
        run: |
          node --check TEST_V1754_GATES.mjs
          node TEST_V1754_GATES.mjs
          node TEST_V1754_ROAD_GATE.mjs
          node TEST_V1753_JOINTS.mjs
          node TEST_V59.mjs
          node TEST_V80.mjs
          node TEST_V73.mjs
