name: V125 Checkpoint 240 Turns
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Measure expansion and eras at 240 turns
        env:
          V125_SEED: '12501'
          V125_TURNS: '240'
        run: node TEST_V125_CAMPAIGN.mjs
      - name: Store checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v125-checkpoint-240
          path: artifacts-v125/seed-*.json
