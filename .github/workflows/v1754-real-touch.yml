name: V175.4 Actual Mobile Touch Wall Construction QA
on:
  push:
    branches: [main]
    paths:
      - 'TEST_V1754_REAL_TOUCH.mjs'
      - 'TEST_V1754_CURVED_TOUCH.mjs'
      - 'wall-draw-v175.js'
      - 'civilization.js'
      - 'civilization-core.js'
      - 'navigation.js'
      - 'fortifications.js'
      - '.github/workflows/v1754-real-touch.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v1754-real-touch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  paid-walls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate JavaScript syntax
        run: |
          node --check TEST_V1754_REAL_TOUCH.mjs
          node --check wall-draw-v175.js
          node --check civilization.js
      - name: Install real Chromium
        run: |
          npm install --no-save playwright
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Prove a paid wall is built by both touch and mouse
        run: |
          python3 -m http.server 8765 >/tmp/v1754-http.log 2>&1 &
          node TEST_V1754_REAL_TOUCH.mjs
          node TEST_V1754_CURVED_TOUCH.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1754-real-mobile-wall-build-and-errors
          path: |
            artifacts-v1754/
            artifacts-v1754-curves/
