name: V333 Android migration and saved world
on:
  push:
    branches: [feature/world-start-v333]
permissions: {contents: read}
concurrency:
  group: android-v333-test
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Stage V333 update
        run: node native/scripts/stage-game.cjs
      - name: Stage V330 bundle
        run: |
          git fetch origin 966841212bb96cfe3051bf19b3f9f48f8067bb85 --depth=1
          git worktree add /tmp/kuningriigid-v330 966841212bb96cfe3051bf19b3f9f48f8067bb85
          cd /tmp/kuningriigid-v330
          node native/scripts/stage-game.cjs "$GITHUB_WORKSPACE/native/android/app/src/main/assets/game"
      - run: gradle :app:assembleDebug --stacktrace
        working-directory: native/android
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tests/android-upgrade-v333.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-upgrade-diagnostics
          path: |
            native/dist/android-upgrade.png
            native/dist/android-upgrade.log
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: World packing and save tests
        run: |
          node tests/world-start-v333.mjs
          node tests/generated-world-v331.mjs
          node tests/snapshot-lazy-v332.mjs
      - name: Install browser control
        run: npm install --prefix /tmp/world-check playwright@1.56.1 --fetch-retries=1 --fetch-timeout=60000
      - name: Verify saved world in browser
        env:
          TREE_NODE_MODULES: /tmp/world-check/node_modules
        run: |
          export CHROMIUM_PATH=$(command -v google-chrome || command -v chromium || true)
          if [ -z "$CHROMIUM_PATH" ]; then
            /tmp/world-check/node_modules/.bin/playwright install chromium
            export CHROMIUM_PATH=$(node -e "console.log(require('/tmp/world-check/node_modules/playwright').chromium.executablePath())")
          fi
          node tests/generated-world-v331-browser.cjs
