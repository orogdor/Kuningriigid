name: Kuningriigid Godot editable port Android
on:
  push:
    branches: [godot-port-development]
    paths:
      - 'game/**'
      - 'bootstrap/**'
      - '.github/workflows/godot-apk-test.yml'
  workflow_dispatch:
concurrency:
  group: godot-port-development-build
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    outputs:
      tests_ok: ${{ steps.regression.outcome }}
    timeout-minutes: 55
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Use directly editable Godot source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/logs
          test -s game/project.godot
          test -s bootstrap/project.godot
          test -s game/tests/port_checks.gd
          if ! command -v python3 >/dev/null 2>&1; then
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3
          fi
          python3 --version
          mkdir -p game/data
          python3 - <<'PY_VERSION'
          import json, os
          from datetime import datetime, timezone
          info = {
              "tag": "godot-dev-" + os.environ["GITHUB_RUN_NUMBER"],
              "commit": os.environ["GITHUB_SHA"],
              "built_at": datetime.now(timezone.utc).isoformat(),
              "channel": "dev",
          }
          with open("game/data/build_info.json", "w", encoding="utf-8") as file:
              json.dump(info, file, ensure_ascii=False)
          print("Embedded pack version:", info["tag"])
          PY_VERSION
          echo 'Building editable GitHub branch source, not the old compressed v3.3 snapshot.'
      - name: Static validations
        shell: bash
        run: |
          set -euo pipefail
          python3 game/tools/run_qa_checks.py 2>&1 | tee dist/logs/01-static.txt
      - name: Godot import and parser check
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path game --editor --import --quit 2>&1 | tee dist/logs/02-import.txt
          if grep -Ei 'SCRIPT ERROR|Parse Error|Parser Error|Failed to load script' dist/logs/02-import.txt; then exit 1; fi
      - name: Execute Godot tests (experimental, 70s cap)
        id: regression
        shell: bash
        continue-on-error: true
        timeout-minutes: 2
        run: |
          set -uo pipefail
          timeout 70s godot --headless --path game --script res://tests/headless_ci.gd 2>&1 | tee dist/logs/03-tests.txt
          result=${PIPESTATUS[0]}
          if [[ "$result" -ne 0 ]]; then
            echo "::warning::Regression suite is not green (exit $result). APK will be experimental."
            exit 1
          fi
          grep -q 'V131_REGRESSION:' dist/logs/03-tests.txt || exit 1
          if grep -Ei 'SCRIPT ERROR|Parse Error|Parser Error|V131_TEST_FAILURES' dist/logs/03-tests.txt; then exit 1; fi
      - name: Export game pack
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path game --export-pack GamePack "$GITHUB_WORKSPACE/dist/game.pck" 2>&1 | tee dist/logs/04-pck.txt
          test -s dist/game.pck
          mkdir -p bootstrap/seed
          cp dist/game.pck bootstrap/seed/game.pck
      - name: Verify bootstrap scene and game PCK
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path bootstrap --editor --import --quit 2>&1 | tee dist/logs/05-bootstrap.txt
          godot --headless --path bootstrap --script res://tests/pck_smoke.gd 2>&1 | tee dist/logs/06-smoke.txt
          grep -q BOOTSTRAP_SMOKE_PASS dist/logs/06-smoke.txt
      - name: Set up Godot Android export templates
        shell: bash
        run: |
          set -euo pipefail
          dest="${HOME}/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$dest"
          if [[ ! -s "$dest/android_debug.apk" ]]; then
            source_template=$(find /root /opt /usr/local /usr/share /github/home -type f -name android_debug.apk -print -quit 2>/dev/null || true)
            [[ -n "$source_template" ]] || { echo "Android export templates missing"; exit 1; }
            source_dir=$(dirname "$source_template")
            cp "$source_dir/android_debug.apk" "$dest/android_debug.apk"
            cp "$source_dir/android_release.apk" "$dest/android_release.apk"
          fi
          ls -lh "$dest/android_debug.apk" "$dest/android_release.apk"
          mkdir -p "${HOME}/.config/godot"
          if [[ -s /root/.config/godot/editor_settings-4.7.tres ]]; then
            cp /root/.config/godot/editor_settings-4.7.tres "${HOME}/.config/godot/editor_settings-4.7.tres"
          else
            printf '[gd_resource type="EditorSettings" format=3]\n[resource]\n' > "${HOME}/.config/godot/editor_settings-4.7.tres"
            printf 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"\n' >> "${HOME}/.config/godot/editor_settings-4.7.tres"
            printf 'export/android/android_sdk_path = "/usr/lib/android-sdk"\n' >> "${HOME}/.config/godot/editor_settings-4.7.tres"
            printf 'export/android/debug_keystore = "/root/debug.keystore"\n' >> "${HOME}/.config/godot/editor_settings-4.7.tres"
            printf 'export/android/debug_keystore_user = "androiddebugkey"\n' >> "${HOME}/.config/godot/editor_settings-4.7.tres"
            printf 'export/android/debug_keystore_pass = "android"\n' >> "${HOME}/.config/godot/editor_settings-4.7.tres"
          fi
      - name: Export Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path bootstrap --export-debug Android "$GITHUB_WORKSPACE/dist/Kuningriigid-Godot-Dev.apk" 2>&1 | tee dist/logs/07-android.txt
          test -s dist/Kuningriigid-Godot-Dev.apk
          python3 - <<'PYAPK'
          from zipfile import ZipFile
          with ZipFile('dist/Kuningriigid-Godot-Dev.apk') as z:
              assert z.testzip() is None
              assert 'AndroidManifest.xml' in z.namelist()
          PYAPK
      - name: Downloadable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kuningriigid-Godot-Dev-APK
          path: |
            dist/Kuningriigid-Godot-Dev.apk
            dist/game.pck
      - name: Diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kuningriigid-Godot-Dev-test-logs
          path: dist/logs/
          if-no-files-found: warn
  publish_preview:
    name: Publish tagged Godot OTA prerelease
    needs: android
    if: ${{ needs.android.result == 'success' && needs.android.outputs.tests_ok == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Kuningriigid-Godot-Dev-APK
          path: dist
      - name: Publish tested APK and game pack
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/Kuningriigid-Godot-Dev.apk
          test -s dist/game.pck
          tag="godot-dev-${{ github.run_number }}"
          gh release create "$tag" dist/Kuningriigid-Godot-Dev.apk dist/game.pck \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Kuningriigid Godot test ${{ github.run_number }}" \
            --notes "Godot Androidi eelväljalase. Regressioonitestid läbitud; mängu toimimine telefonis vajab kontrolli." \
            --prerelease
