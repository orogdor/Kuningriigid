name: V220.1 wall renovation throughput and three new cities
on:
  push:
    branches: [main]
    paths:
      - 'scripts/test-wall-throughput-v220.mjs'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check ai-defenses-v128.js
      - run: node scripts/test-wall-throughput-v220.mjs
      - run: node scripts/test-city-housing-walls-v218.mjs
