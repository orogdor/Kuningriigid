name: V219 fresh world to Bronze end and takeover
on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-fresh-bronze-v219.mjs'
      - '.github/workflows/v219-fresh-world.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  simulate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Simulate newly generated independent map from turn zero
        run: node scripts/generate-fresh-bronze-v219.mjs
      - name: Verify real Bronze Age city can be taken over and continued
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {Civilization} from './civilization-core.js';
          import {loadFreshBronzeV219} from './fresh-bronze-v219.js';
          const s=JSON.parse(fs.readFileSync('scenarios/bronze-fresh-v219.json','utf8'));
          const saved=await loadFreshBronzeV219(async()=>({ok:true,json:async()=>s}));
          const m=saved.bronzeFreshV219;
          assert.deepEqual(m.initial.ages,[0,0,0,0]);
          assert.equal(m.initial.cityCount,0);
          assert.equal(m.priorSaveLoaded,false);
          assert.equal(m.age,1);
          assert.ok(m.bronzeTurns>=30);
          assert.ok(m.buildings>0&&m.fortifications>0);
          const game=new Civilization(JSON.parse(JSON.stringify(saved)));
          const previous=game.s.time;
          game.tick(12);
          assert.ok(game.s.time>previous);
          console.log('V219 NEW ZERO-START GAME VERIFIED',JSON.stringify(m));
          NODE
      - name: Publish the new playable snapshot to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scenarios/bronze-fresh-v219.json scenarios/bronze-fresh-v219.manifest.json
          git commit -m "V219: publish new-from-zero bronze AI city takeover"
          for n in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v219-fresh-world-takeover
          path: |
            scenarios/bronze-fresh-v219.json
            scenarios/bronze-fresh-v219.manifest.json
          if-no-files-found: ignore
