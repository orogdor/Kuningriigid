name: Diagnose Android V330 upgrade
on:
  push:
    branches: [investigate/android-v332-startup]
permissions: {contents: read}
concurrency:
  group: android-upgrade-investigation
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Stage V332 update
        env:
          NATIVE_REVISION: 844a317919d595c35f15aa9a61f24e1913741d1c
        run: node native/scripts/stage-game.cjs
      - name: Stage V330 bundle
        run: |
          git fetch origin 966841212bb96cfe3051bf19b3f9f48f8067bb85 --depth=1
          git worktree add /tmp/kuningriigid-v330 966841212bb96cfe3051bf19b3f9f48f8067bb85
          cd /tmp/kuningriigid-v330
          node native/scripts/stage-game.cjs "$GITHUB_WORKSPACE/native/android/app/src/main/assets/game"
      - run: gradle :app:assembleDebug --stacktrace
        working-directory: native/android
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tests/android-v330-upgrade-diagnostic.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-upgrade-diagnostics
          path: |
            native/dist/android-upgrade.png
            native/dist/android-upgrade.log
