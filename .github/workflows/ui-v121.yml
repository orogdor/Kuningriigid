name: V121 Build Menu and Map Navigation UI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium and browser test dependencies
        run: |
          npm install --no-save playwright
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium --with-deps
          fi
      - name: Test building categories and gesture behavior
        run: |
          node TEST_V121.mjs
          python3 -m http.server 8765 >/tmp/v121-http.log 2>&1 &
          node TEST_V121_UI.mjs
      - name: Upload viewport captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v121-construction-screenshots
          path: artifacts-v121/*.png
          if-no-files-found: ignore
