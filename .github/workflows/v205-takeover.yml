name: V205 completed second wall takeover
on:
  push:
    branches: [main]
    paths:
      - 'second-wall-takeover-v205.js'
      - 'scripts/test-wall-takeover-v205.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  second-wall-takeover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-wall-takeover-v205.mjs
