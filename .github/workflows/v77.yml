name: V77 Stone Age buildings and demo save
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stone-age-models:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stone Age models and compatible V4 sample save
        run: |
          node --check stone-buildings-v77.js
          node --check stone-demo-v77.js
          node --check buildings.js
          node --check civilization.js
          node --check TEST_V77_UI.mjs
          node TEST_V77.mjs
          node TEST_V76.mjs
          node TEST_V75.mjs
          node TEST_V73.mjs
      - name: Install Chromium Playwright
        run: |
          npm install --no-save playwright
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium --with-deps
          fi
      - name: Open stone-age city on phone and desktop
        run: |
          python3 -m http.server 8765 >/tmp/v77-server.log 2>&1 &
          node TEST_V77_UI.mjs
      - name: Upload ready-to-import JSON save and 3D screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v77-stone-age-city-saved-game
          path: artifacts-v77/
          if-no-files-found: ignore
