name: V139 Wall Resources Audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v139-wall-audit.yml', 'scripts/report-v139-defenses.mjs']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node scripts/report-v139-defenses.mjs
