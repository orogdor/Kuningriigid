name: V139 Wall Resources Audit
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node scripts/report-v139-defenses.mjs
      - run: node scripts/diagnose-wall-sites-v139.mjs
