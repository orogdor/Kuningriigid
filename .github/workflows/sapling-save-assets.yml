name: Save validated Sapling assets
on:
  push:
    branches: [experimental/sapling-trees-30]
    paths: ['.github/workflows/sapling-save-assets.yml']
permissions:
  contents: write
  actions: read
jobs:
  save:
    if: github.ref == 'refs/heads/experimental/sapling-trees-30'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experimental/sapling-trees-30
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42189504137
          name: sapling-trees-review
          path: .
      - name: Verify and save actual Blender files
        run: |
          pip install Pillow
          python tools/trees/validate.py
          python -c "import json; d=json.load(open('assets/sapling-trees/manifest.json')); assert len(d['trees'])==30"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/sapling-trees previews/sapling-trees reports/sapling-trees*.json
          git diff --cached --quiet || git commit -m 'Save 30 validated Sapling trees and actual GLB renders [skip ci]'
          git fetch origin experimental/sapling-trees-30
          git rebase origin/experimental/sapling-trees-30
          git push origin HEAD:experimental/sapling-trees-30
