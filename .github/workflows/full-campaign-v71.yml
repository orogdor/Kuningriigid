name: Full campaign V71 simulation
on:
  push:
    branches:
      - analysis/full-playthrough-v71
    paths:
      - "tests/full-campaign-v71.mjs"
      - ".github/workflows/full-campaign-v71.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CAMPAIGN_SEED: "20261019"
      MAX_SIM_SECONDS: "60000"
      MAX_WALL_SECONDS: "720"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run genuine economy, AI, movement and combat simulation
        run: node tests/full-campaign-v71.mjs
      - name: Upload match report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-playthrough-v71
          path: playthrough-v71-report.json
          if-no-files-found: warn
