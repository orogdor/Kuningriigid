name: V139 Compact Cities and Walls
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node --check civilization-core.js
      - run: node TEST_V139.mjs
      - run: node TEST_V138.mjs
      - run: node TEST_V137.mjs
