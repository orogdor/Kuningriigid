name: V140 First Modern AI Campaign
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v140-modern-test.yml'
      - 'scripts/run-to-first-modern-v140.mjs'
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: v140-modern-test
  cancel-in-progress: true
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    env:
      MODERN_SEED: 139023
      MODERN_MAX_TURNS: 2400
      MODERN_MAX_MS: 1110000
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node --check scripts/run-to-first-modern-v140.mjs
      - name: Run all four nations under genuine AI until first modern transition
        run: node scripts/run-to-first-modern-v140.mjs
      - name: Verify actual modern age and saved city integrity
        run: |
          node --input-type=module -e "import fs from 'node:fs';const m=JSON.parse(fs.readFileSync('scenarios/ai-modern-v140.manifest.json'));const s=JSON.parse(fs.readFileSync('scenarios/ai-modern-v140.json'));if(!s.cities?.length||!m.turn)throw Error('No playable cities');if(m.success&&s.ages[0]<6)throw Error('False modern claim');if(!m.success)console.log('Not yet modern; checkpoint preserved and can be resumed:',m.reason,m.ages);else console.log('FIRST MODERN:',m.turn,'team:',m.sourceTeam,'cities:',m.cities.length)"
      - name: Publish checkpoint, honest report and playable campaign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scenarios/ai-modern-v140.json scenarios/ai-modern-v140.manifest.json scenarios/ai-modern-v140.checkpoint.json
          if ! git diff --cached --quiet; then
            git commit -m "V140: AI campaign to modernity, transparent progress and playable takeover"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi
