name: V166 Stone Age Fortified Villages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stone-forts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax and early village defense rules
        run: |
          node --check stone-village-defenses-v166.js
          node --check ai-defenses-v128.js
          node --check civilization-core.js
          node --check builders.js
          node --check buildings.js
          node --check navigation.js
          node --check civilization.js
          node --check TEST_V166_STONE_FORTS.mjs
          node TEST_V166_STONE_FORTS.mjs
      - name: Preserve historic Bronze walls
        run: |
          node TEST_V139.mjs
          node TEST_V160.mjs
          node TEST_V163_STONE_CITY.mjs
