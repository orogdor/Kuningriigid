name: V210 investigate two real AI wall gaps
on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-wall-gaps-v210.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/audit-wall-gaps-v210.mjs
