name: V125 Archive Campaign Results
on:
  workflow_run:
    workflows: ['V125 Long Campaign Validation']
    types: [completed]
permissions:
  actions: read
  contents: write
jobs:
  archive:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: v125-campaign-*
          path: downloaded
          merge-multiple: true
      - name: Consolidate the three genuine 900-turn campaigns
        run: |
          mkdir -p reports/V125
          cp downloaded/seed-*.json reports/V125/
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const reports=fs.readdirSync('reports/V125').filter(x=>/^seed-\d+\.json$/.test(x)).map(x=>JSON.parse(fs.readFileSync('reports/V125/'+x,'utf8'))).sort((a,b)=>a.seed-b.seed);
          if(reports.length!==3)throw Error('Expected three actual campaign reports, found '+reports.length);
          const headers=['Seed','Turns','Modern arrival (countries 1–4)','Towns (countries 1–4)','Troops','Trade shipments','Wars declared'];
          const lines=['# Kuningriigid V125 – three-seed long campaign test','','*Original V125 AI and economics, no free resources, no forced advances.*','','| '+headers.join(' | ')+' |','|'+headers.map(()=>'---').join('|')+'|'];
          for(const r of reports)lines.push('| '+[r.seed,r.turns,r.reachedModern.map(x=>x??'—').join(', '),r.final.map(x=>x.towns).join(', '),r.final.map(x=>x.troops).join(', '),r.trades.length,r.wars.length].join(' | ')+' |');
          const arrived=reports.flatMap(x=>x.reachedModern).filter(x=>x!==null);
          lines.push('','**Mean observed modern arrival:** '+(arrived.length?(arrived.reduce((n,x)=>n+x,0)/arrived.length).toFixed(1):'not reached')+' turns across '+arrived.length+'/12 countries.','',
           '**Targets:** mean modern era in approximately 600–700 turns, 10–12 towns per country.','',
           'This report distinguishes accomplished results from targets. Individual seeded histories, city founding, resource inventories, trade shipments and border wars are in the sibling JSON files.',
           '',
           'Note: headless economy ticks do not start browser battle collisions, so wars here describe declared war states and not completed tactical battles.');
          fs.writeFileSync('reports/V125/REPORT.md',lines.join('\n')+'\n');
          console.log(lines.join('\n'));
          NODE
      - name: Commit measured results
        run: |
          git config user.name "Kuningriigid Test Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/V125
          git diff --cached --quiet || (git commit -m "V125: retain three full campaign test runs and measured pacing report" && git push origin HEAD:main)
