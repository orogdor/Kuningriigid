name: Kuningriigid V204 first suburb wall
on:
  push:
    branches: [main]
    paths:
      - 'scripts/test-first-suburb-v204.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-real-suburb:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check new rules and play until the first wall
        run: node scripts/test-first-suburb-v204.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v204-first-wall-test
          path: reports/v204-first-wall.json
          if-no-files-found: ignore
