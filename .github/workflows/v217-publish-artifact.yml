name: V217 publish verified new-world bronze artifact
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v217-publish-artifact.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Recover completed zero-start simulation without playing again
        uses: actions/download-artifact@v4
        with:
          name: v217-fresh-bronze-takeover
          run-id: 40671284268
          github-token: ${{ github.token }}
          path: scenarios
      - name: Verify genuinely new map and last Bronze Age turn
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {Civilization} from './civilization-core.js';
          import {loadFreshBronzeV217} from './fresh-bronze-v217.js';
          const s=JSON.parse(fs.readFileSync('scenarios/bronze-fresh-v217.json','utf8'));
          const v=await loadFreshBronzeV217(async()=>({ok:true,json:async()=>s}));
          const m=v.bronzeFreshV217;
          assert.equal(m.initial.cities,0);
          assert.equal(m.initial.at,0);
          assert.deepEqual(m.initial.ages,[0,0,0,0]);
          assert.equal(m.priorSaveLoaded,false);
          assert.equal(m.newMap,true);
          assert.equal(m.organicAI,true);
          assert.equal(m.bronzeCompleted,true);
          assert.equal(v.ages[0],1);
          assert.ok(m.bronzeTurns>=20);
          assert.ok(m.cityBuildings>0&&m.fortifications>0);
          assert.ok(m.worldRoadEdges>0);
          const before=v.time,game=new Civilization(v);
          game.tick(12);assert.ok(game.s.time>before);
          console.log('V217 NEW MAP FINAL BRONZE VERIFIED',JSON.stringify(m));
          NODE
      - name: Publish actual saved state on GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scenarios/bronze-fresh-v217.json scenarios/bronze-fresh-v217.manifest.json
          git commit -m "V217: publish played new-map bronze-end Sampola takeover"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
