name: V174 Courtyards and Organic Streetfront QA
on:
  push:
    branches: [main]
    paths:
      - 'streetfront-v174.js'
      - 'historic-urban-v138.js'
      - 'town-models-v154.js'
      - 'TEST_V174_STREETFRONT.mjs'
      - '.github/workflows/v174-streetfront.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v174-streetfront-${{ github.ref }}
  cancel-in-progress: true
jobs:
  yards-and-roads:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify courtyard/frontage planning and road conservation
        run: |
          node --check streetfront-v174.js
          node --check historic-urban-v138.js
          node --check town-models-v154.js
          node --check TEST_V174_STREETFRONT.mjs
          node TEST_V174_STREETFRONT.mjs
          node TEST_V173_STREETS.mjs
          node TEST_V59.mjs
          node TEST_V80.mjs
          node TEST_V154.mjs --node-only
          node TEST_V172_LAYOUT.mjs
          node TEST_V168_RING_CORRIDOR.mjs
          node TEST_V169_FOUNDING.mjs
          node TEST_V73.mjs
      - name: Real AI growth 48 turns
        run: node scripts/stone-town-v163-report.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v174-compact-courtyard-and-road-tests
          path: artifacts-v163/
