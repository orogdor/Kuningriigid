<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kuningriigid V222 · animatsioonide proov</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#131c1a;color:#eee7d6}
*{box-sizing:border-box}
body{margin:0;overflow:hidden}
main{height:100dvh;display:flex;flex-direction:column}
header{z-index:2;flex:none;background:#1a2724;border-bottom:1px solid #3b5344;padding:12px 14px;box-shadow:0 6px 18px #0005}
h1{font-size:1.05rem;letter-spacing:.04em;margin:0 0 4px}
small{color:#bac7b6;font-size:.78rem}
.controls{display:flex;gap:8px;align-items:end;margin-top:12px}
label{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0;color:#c9d4c6;font-size:.75rem}
select{appearance:auto;width:100%;background:#293931;color:#f7efd8;border:1px solid #62725d;border-radius:8px;padding:9px 7px;font:inherit;font-size:.95rem}
#viewport{flex:1;min-height:0;position:relative;touch-action:pan-y;background:linear-gradient(#344741,#18231f)}
#viewport canvas{display:block;width:100%;height:100%;touch-action:none}
#status{position:absolute;top:16px;left:16px;right:16px;text-align:center;pointer-events:none;color:#faf2d8;text-shadow:0 2px 6px #101817}
footer{flex:none;background:#1a2724;padding:9px 14px;color:#bac7b6;font-size:.76rem;text-align:center}
a{color:#c0e9bf}
@media(min-width:720px){header{padding:16px 22px}h1{font-size:1.25rem}.controls{max-width:600px}}
</style>
</head>
<body><main>
<header>
<h1>Kuningriigid · V222 animatsioonide eelvaade</h1>
<small>Praegused mängumudelid ja uued liikumised · puuduta ja lohista, et inimest pöörata</small>
<div class="controls">
<label>Tegelane
<select id="person">
<optgroup label="Töölised">
<option value="stone_lumber">Puuraidur</option>
<option value="stone_miner">Kiviraidur</option>
<option value="stone_builder">Ehitaja</option>
<option value="stone_farmer">Põllumees</option>
<option value="stone_gatherer">Korjaja</option>
<option value="stone_fisher">Kalur</option>
<option value="stone_watercarrier">Veekandja</option>
</optgroup>
<optgroup label="Kiviaja sõdalased">
<option value="spearman">Odamees</option>
<option value="axeman">Kirvemees</option>
<option value="slinger">Kiviviskaja</option>
<option value="archer">Vibumees</option>
<option value="scout">Avastaja</option>
<option value="militia">Maakaitseväelane</option>
</optgroup>
</select></label>
<label>Animatsioon
<select id="action"></select>
</label>
</div>
</header>
<section id="viewport"><div id="status">Laen 3D-mudelit…</div></section>
<footer>V221 3D-inimene + V148 sõdurid · V222 liikumised · <a href="./?v=222">Ava mäng</a></footer>
</main>
<script type="module">
import * as T from './vendor/three.module.js';
import {createSoldier,animateSoldier} from './visuals.js?v=222';
const person=document.getElementById('person'),activity=document.getElementById('action'),viewport=document.getElementById('viewport'),status=document.getElementById('status');
const roles={stone_lumber:'chop',stone_miner:'mine',stone_builder:'build',stone_farmer:'farm',stone_gatherer:'gather',stone_fisher:'fishing',stone_watercarrier:'water'};
const isWorker=kind=>kind.startsWith('stone_');
const scene=new T.Scene();scene.background=new T.Color('#334942');
const camera=new T.PerspectiveCamera(35,1,.1,100);
camera.position.set(2.5,2.25,5.5);camera.lookAt(0,.92,0);
const ambient=new T.HemisphereLight('#e3eeed','#6b684d',2.0);scene.add(ambient);
const sun=new T.DirectionalLight('#ffedcb',2.1);sun.position.set(-2.8,6,5);scene.add(sun);
const floor=new T.Mesh(new T.CircleGeometry(3.1,64),new T.MeshStandardMaterial({color:'#7a815c',roughness:1}));
floor.rotation.x=-Math.PI/2;floor.position.y=-.025;scene.add(floor);
let renderer,actor,rotation=-.15;
try{renderer=new T.WebGLRenderer({antialias:true,alpha:false,powerPreference:'low-power'});}
catch(e){status.textContent='WebGL pole saadaval: '+String(e?.message||e);throw e}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.7));
renderer.outputColorSpace=T.SRGBColorSpace;
viewport.prepend(renderer.domElement);
const resize=()=>{const w=viewport.clientWidth,h=viewport.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/Math.max(1,h);camera.updateProjectionMatrix();};
window.addEventListener('resize',resize);resize();
const params=new URLSearchParams(location.search);
if(params.has('kind')&&[...person.options].some(o=>o.value===params.get('kind')))person.value=params.get('kind');
function choices(){
 const warrior=!isWorker(person.value),values=warrior?[['attack','Rünnak'],['walk','Kõndimine'],['idle','Valveasend'],['formation','Kaitseasend'],['hit','Tabamus']]:[['work','Töötamine'],['walk','Kõndimine'],['carry','Koorma kandmine'],['idle','Seismine']];
 activity.replaceChildren(...values.map(([value,label])=>{const el=document.createElement('option');el.value=value;el.textContent=label;return el;}));
 if(params.has('action')&&values.some(x=>x[0]===params.get('action')))activity.value=params.get('action');
}
function swap(){
 if(actor)scene.remove(actor);
 actor=createSoldier(scene,0,0,'#8b9e67',person.value);
 actor.rotation.y=rotation;
 actor.position.y=0;
 status.textContent='';
}
person.addEventListener('change',()=>{choices();swap();});
choices();swap();
let previousX=null;
renderer.domElement.addEventListener('pointerdown',e=>{previousX=e.clientX;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(previousX==null)return;rotation+=(e.clientX-previousX)*.012;previousX=e.clientX;});
for(const event of ['pointerup','pointercancel','lostpointercapture'])renderer.domElement.addEventListener(event,()=>{previousX=null});
let first=performance.now();
function frame(now){
 requestAnimationFrame(frame);
 const time=(now-first)/1000,mode=activity.value,kind=person.value,worker=isWorker(kind);
 let attack={phase:-1},moving=mode==='walk'||mode==='carry';
 if(worker){attack.action=mode==='work'?roles[kind]:mode==='carry'?'carry':null;}
 else if(mode==='attack'){
   const u=(time%1.7)/1.1;attack={phase:u<=1?u:-1,weapon:kind==='archer'?'bow':kind==='slinger'?'sling':'spear'};
 }else if(mode==='formation'){attack={phase:-1,formation:kind==='spearman'?'spear_wall':'shield_wall',formed:1};}
 else if(mode==='hit'){attack={phase:-1,hit:time%2<.2};}
 if(actor){actor.rotation.y=rotation;animateSoldier(actor,time,moving,attack);}
 renderer.render(scene,camera);
}
requestAnimationFrame(frame);
</script>
</body></html>
