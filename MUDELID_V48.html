<!doctype html><html lang="et"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kuningriigid V48 – 3D mudelid</title><style>
html,body{margin:0;background:#14212b;color:#f0eee2;font-family:system-ui,Arial;height:100%;overflow:hidden}canvas{display:block;width:100%;height:100%}.ui{position:fixed;top:12px;left:12px;background:#14232be8;padding:18px;border:1px solid #64766d;border-radius:14px;max-width:330px;box-shadow:0 12px 40px #0008}h1{font-size:20px;margin:0 0 10px}select,button{width:100%;background:#31454b;color:#fff;padding:10px;border:1px solid #78917f;border-radius:6px;margin:5px 0;font:inherit}a{color:#a0e5c8}p{font-size:13px;line-height:1.5}#info{font-size:13px;color:#cbd9c8}@media(max-width:650px){.ui{top:0;left:0;right:0;max-width:none;border-radius:0;padding:9px 12px}h1{font-size:16px}.ui p{display:none}}
</style></head><body><div class="ui"><h1>Kuningriigid V48 · 3D mudelite vaatleja</h1><label for="which">Mudel</label><select id="which"><option value="oak_1000_3">Lehtpuu</option><option value="pine_1000_3">Kuusk</option><option value="palm_1000_3">Palm</option><option value="cactus_1000_3">Kaktus</option><option value="rock_1000_3">Kaljupaljand</option><option value="timber_house_1000_3">Elamu</option><option value="market_1000_3">Turg</option><option value="windmill_1000_3">Tuulik</option></select><div id="info"></div><p>Lohista mudeli pööramiseks, kasuta hiireratast või kahe sõrmega suumimist. Kõik mudelid on päriselt 3D ja saadaval GLB kujul.</p><a href="index.html">← Tagasi mängu</a> · <a id="file" download>Laadi GLB alla</a></div>
<script type="module">
import * as T from './vendor/three.module.js';
import {createV48Mesh} from './model-runtime-v48.js';
const select=document.querySelector('#which'),info=document.querySelector('#info'),file=document.querySelector('#file');const scene=new T.Scene();scene.background=new T.Color('#182b32');const camera=new T.PerspectiveCamera(48,innerWidth/innerHeight,.03,200);camera.position.set(6,4.6,8);const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(2,devicePixelRatio));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.7;document.body.append(renderer.domElement);
scene.add(new T.HemisphereLight('#e9f3ff','#817662',2));const sun=new T.DirectionalLight('#fff0d5',3);sun.position.set(6,9,4);scene.add(sun);const floor=new T.Mesh(new T.CylinderGeometry(3.7,4.1,.2,48),new T.MeshStandardMaterial({color:'#556158',roughness:1}));floor.position.y=-.12;scene.add(floor);let object=null,rot=0,dist=7;
function load(){if(object)scene.remove(object);object=createV48Mesh(select.value,2);scene.add(object);const box=new T.Box3().setFromObject(object);const v=box.getSize(new T.Vector3());object.position.y=-box.min.y;dist=Math.max(5,v.length()*1.35);info.textContent=`Mudel: ${select.value} · ${Math.round(object.geometry.index.count/3)} kolmnurka`;file.href=`models-v48/${select.value}.glb`;file.download=select.value+'.glb'}select.addEventListener('change',load);load();let down=false,last=0;renderer.domElement.addEventListener('pointerdown',e=>{down=true;last=e.clientX;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointerup',()=>down=false);renderer.domElement.addEventListener('pointermove',e=>{if(down){rot+=(e.clientX-last)*.012;last=e.clientX}});renderer.domElement.addEventListener('wheel',e=>{dist=Math.max(3,Math.min(30,dist+e.deltaY*.009));e.preventDefault()},{passive:false});function frame(){requestAnimationFrame(frame);if(object)object.rotation.y=rot+.12*Math.sin(performance.now()*.0002);camera.position.set(Math.sin(.6)*dist,dist*.65,Math.cos(.6)*dist);camera.lookAt(0,1.7,0);renderer.render(scene,camera)}frame();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
