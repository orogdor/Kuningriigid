<!doctype html><html lang="et"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kuningriigid V46 · 3D mudelite vaatleja</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#101f28;color:#eadbb5;font:14px system-ui,Arial}canvas{position:fixed;inset:0;display:block}header{position:fixed;z-index:3;top:15px;left:15px;width:min(300px,calc(100vw - 60px));padding:18px;background:#152b30e9;backdrop-filter:blur(14px);border:1px solid #b8a47788;border-radius:12px;box-shadow:0 10px 40px #071318ac}h1{font:22px Georgia;margin:0 0 9px}p{line-height:1.55;color:#c7d2c6;margin:0 0 14px;font-size:12px}label{display:block;margin-bottom:12px;color:#d1c8ae}select{display:block;width:100%;margin-top:5px;padding:10px;background:#244149;border:1px solid #8b907d;border-radius:6px;color:#fff;font:inherit}a{color:#e4c787}footer{position:fixed;bottom:15px;right:15px;background:#152b30d9;border-radius:8px;padding:10px;font-size:11px;color:#c3cbbf}</style></head><body><canvas id="preview"></canvas><header><h1>Kuningriigid · 3D mudelid</h1><p>V46 reaalsed 3D-geomeetriad: hooned, ajastute kujundus ja puu. Lohista mudelit pööramiseks ning kasuta hiireratast suumimiseks.</p><label>Hoone või loodus<select id="model"></select></label><label>Ajastu<select id="age"><option value="0">Kiviaeg</option><option value="1">Pronksiaeg</option><option value="2">Rauaaeg</option><option value="3">Keskaeg</option><option value="4">Renessanss</option><option value="5">Tööstusajastu</option><option value="6">Moodne ajastu</option></select></label><a href="index.html">← Tagasi mängu</a></header><footer>Mudelid on veebimängu Three.js geomeetriad · ei vaja internetiühendust</footer><script type="module">
import * as T from './vendor/three.module.js';
import {createAgeBuilding} from './buildings.js';
import {BUILDINGS} from './civilization-core.js';
import {addTree} from './visuals.js';
const canvas=document.getElementById('preview'),renderer=new T.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();scene.background=new T.Color('#738b88');scene.fog=new T.Fog('#738b88',45,90);scene.add(new T.HemisphereLight(0xf1e7d6,0x344c4a,1.9));const sun=new T.DirectionalLight(0xffd3a0,2.4);sun.position.set(-10,22,13);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-22;sun.shadow.camera.right=22;sun.shadow.camera.top=22;sun.shadow.camera.bottom=-22;scene.add(sun);
const floor=new T.Mesh(new T.CircleGeometry(13,64),new T.MeshStandardMaterial({color:'#657960',roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const rim=new T.Mesh(new T.TorusGeometry(12.5,.15,8,96),new T.MeshStandardMaterial({color:'#d1b780',metalness:.1}));rim.rotation.x=-Math.PI/2;rim.position.y=.08;scene.add(rim);
const camera=new T.PerspectiveCamera(44,1,.1,100);let yaw=.7,pitch=.43,zoom=19,drag=false,ox=0,oy=0,active;
const select=document.getElementById('model');select.add(new Option('Lehtpuu','tree'));select.add(new Option('Okaspuu','pine'));for(const [key,b] of Object.entries(BUILDINGS))select.add(new Option(b.name||key,key));
select.value='hall';document.getElementById('age').value='3';function update(){if(active)scene.remove(active);const age=+document.getElementById('age').value,type=select.value;active=new T.Group();if(type==='tree'||type==='pine')addTree(active,0,0,0,type==='tree'?1:0,1.15);else active.add(createAgeBuilding(type,0,age));scene.add(active)}select.onchange=update;document.getElementById('age').onchange=update;update();
canvas.onpointerdown=e=>{drag=true;ox=e.clientX;oy=e.clientY;canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-ox)*.007;pitch=Math.min(1.25,Math.max(.1,pitch+(e.clientY-oy)*.006));ox=e.clientX;oy=e.clientY};canvas.onpointerup=()=>drag=false;canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.min(35,Math.max(8,zoom*(e.deltaY>0?1.08:.92)))},{passive:false});
function frame(){requestAnimationFrame(frame);const w=innerWidth,h=innerHeight;if(canvas.width!==Math.floor(w*renderer.getPixelRatio())||canvas.height!==Math.floor(h*renderer.getPixelRatio()))renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();camera.position.set(Math.sin(yaw)*Math.cos(pitch)*zoom,Math.sin(pitch)*zoom+2,Math.cos(yaw)*Math.cos(pitch)*zoom);camera.lookAt(0,2.3,0);renderer.render(scene,camera)}frame();
</script></body></html>
